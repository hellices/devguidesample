#cloud-config
package_update: true
packages:
  - nftables
  - conntrack
  - tcpdump
write_files:
  - path: /etc/sysctl.d/90-runner-nat.conf
    permissions: '0644'
    content: |
      net.ipv4.ip_forward=1
  - path: /etc/nftables.conf
    permissions: '0644'
    content: |
      #!/usr/sbin/nft -f
      flush ruleset
      table inet lab_filter {
        chain input {
          type filter hook input priority filter; policy drop;
          iifname "lo" accept
          ct state established,related accept
          ip saddr 168.63.129.16 udp sport 67 udp dport 68 accept
        }
        chain forward {
          type filter hook forward priority filter; policy drop;
          ct state invalid drop
          ct state established,related counter accept
          ip saddr 10.77.2.0/24 tcp dport { 80, 443 } ct state new counter accept
        }
        chain output {
          type filter hook output priority filter; policy accept;
        }
      }
      table ip lab_nat {
        chain postrouting {
          type nat hook postrouting priority srcnat; policy accept;
          ip saddr 10.77.2.0/24 counter snat to 10.77.1.4
        }
      }
runcmd:
  - sysctl --system
  - nft --check --file /etc/nftables.conf
  - systemctl enable --now nftables
