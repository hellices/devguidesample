<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1280" viewBox="0 0 1680 1280" role="img" aria-labelledby="title desc">
  <title id="title">Runner 빌드 통신과 사설 IP 변경 실험 흐름</title>
  <desc id="desc">개별 주소와 Runner ID를 생략한 실험 흐름도. Runner가 HTTPS 연결을 시작하고 NAT가 출발지 주소를 변환한다. GitHub의 작업 배정 응답은 Runner가 시작한 요청에 대한 응답이며 별도 인바운드 연결이 아니다. Runner는 소스, 이미지, 패키지를 받아 로컬에서 빌드하고 결과와 아티팩트를 송수신한다. 기준 빌드, 동일 IP 재기동, 사설 IP 변경의 세 실험 모두 성공했다. 실제 주소와 식별 정보는 원본 증적에 보존했다.</desc>
  <defs>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
    <marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#0d9488"/></marker>
    <marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <style>
      text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #17233b; }
      .title { font-size: 34px; font-weight: 700; }
      .heading { font-size: 24px; font-weight: 700; }
      .body { font-size: 20px; }
      .small { font-size: 18px; }
      .muted { fill: #52627a; }
      .blue { fill: #1d4ed8; }
      .teal { fill: #0f766e; }
      .orange { fill: #b45309; }
      .mono { font-family: Consolas, "Courier New", monospace; font-size: 21px; }
      .out { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#blue); }
      .back { fill: none; stroke: #0d9488; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#teal); }
      .next { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#gray); }
    </style>
  </defs>
  <rect width="1680" height="1280" fill="#f5f7fb"/>
  <text x="48" y="62" class="title">빌드 통신과 IP 변경 흐름</text>
  <text x="48" y="100" class="body muted">중요: 빌드는 Runner VM에서 실행하며, 연결도 Runner가 먼저 시작한다.</text>
  <rect x="48" y="136" width="1584" height="677" rx="18" fill="#ffffff" stroke="#d7dfeb"/>
  <text x="76" y="177" class="heading">A. 실제 빌드의 데이터 흐름</text>
  <text x="1588" y="177" text-anchor="end" class="small muted">개념적 순서 · 다운로드별 별도 HTTPS 연결 가능</text>

  <rect x="110" y="207" width="300" height="86" rx="12" fill="#e4eeff" stroke="#93b4ec"/>
  <text x="260" y="241" text-anchor="middle" class="heading blue">Runner VM</text>
  <text x="260" y="274" text-anchor="middle" class="small">변경 전 IP 또는 변경 후 IP</text>
  <rect x="690" y="207" width="300" height="86" rx="12" fill="#dff7ed" stroke="#99d4bd"/>
  <text x="840" y="241" text-anchor="middle" class="heading teal">NAT · 방화벽</text>
  <text x="840" y="274" text-anchor="middle" class="small">사설 SNAT + Azure 공인 IP 매핑</text>
  <rect x="1270" y="207" width="310" height="86" rx="12" fill="#edf2f8" stroke="#c6cfde"/>
  <text x="1425" y="241" text-anchor="middle" class="heading">외부 엔드포인트</text>
  <text x="1425" y="274" text-anchor="middle" class="small">GitHub.com · MCR · PyPI 등</text>

  <path d="M260 293V723M840 293V723M1425 293V723" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="86" y="341" class="body blue">①</text>
  <text x="540" y="326" text-anchor="middle" class="body blue">등록 / 대기: Runner가 HTTPS 시작</text>
  <text x="1130" y="326" text-anchor="middle" class="body blue">출발지 변환 후 GitHub로 전달</text>
  <path d="M260 350H840" class="out"/>
  <path d="M840 350H1425" class="out"/>

  <text x="86" y="418" class="body teal">②</text>
  <text x="540" y="402" text-anchor="middle" class="body teal">연결 상태에 따라 현재 Runner로 반환</text>
  <text x="1130" y="402" text-anchor="middle" class="body teal">작업 배정: Runner 요청의 응답</text>
  <path d="M1425 426H840" class="back"/>
  <path d="M840 426H260" class="back"/>

  <text x="86" y="495" class="body blue">③</text>
  <text x="540" y="479" text-anchor="middle" class="body blue">checkout / 이미지·패키지 요청</text>
  <text x="1130" y="479" text-anchor="middle" class="body blue">대상별 HTTPS: GitHub / MCR / PyPI</text>
  <path d="M260 503H840" class="out"/>
  <path d="M840 503H1425" class="out"/>
  <text x="840" y="532" text-anchor="middle" class="small muted">다운로드 응답도 같은 NAT 연결을 통해 돌아옴</text>

  <text x="86" y="592" class="body blue">④</text>
  <rect x="110" y="558" width="300" height="98" rx="12" fill="#e4eeff" stroke="#93b4ec"/>
  <text x="260" y="596" text-anchor="middle" class="heading blue">VM에서 실제 빌드</text>
  <text x="260" y="629" text-anchor="middle" class="small">Docker / Oryx + Flask 응답 검사</text>
  <text x="490" y="595" class="body muted">GitHub는 작업을 배정하고 결과를 수집한다.</text>
  <text x="490" y="630" class="body muted">이 실험의 빌드 프로세스는 Runner 내부에서 실행된다.</text>

  <text x="86" y="704" class="body blue">⑤</text>
  <text x="540" y="686" text-anchor="middle" class="body blue">로그 / 아티팩트 업로드·다운로드</text>
  <text x="1130" y="686" text-anchor="middle" class="body blue">GitHub 및 아티팩트 엔드포인트</text>
  <path d="M260 710H840" class="out"/>
  <path d="M840 710H1425" class="out"/>

  <rect x="76" y="747" width="1528" height="44" rx="8" fill="#e6f7f2"/>
  <text x="840" y="776" text-anchor="middle" class="body teal">응답 화살표 ≠ 서버가 Runner로 시작하는 신규 인바운드 연결 · Runner 대상 DNAT 규칙은 구성하지 않음</text>

  <text x="48" y="865" class="heading">B. IP 변경 영향 검증 — 모두 빌드 완료 후 유휴 상태에서 VM 조작</text>
  <rect x="48" y="891" width="460" height="237" rx="14" fill="#ffffff" stroke="#b4cbee" stroke-width="2"/>
  <rect x="48" y="891" width="460" height="54" rx="14" fill="#e4eeff"/>
  <text x="72" y="927" class="heading blue">1. 기준 빌드</text>
  <text x="72" y="984" class="body">Runner: 변경 전 IP</text>
  <text x="72" y="1021" class="body">최초 등록</text>
  <text x="72" y="1057" class="body">정상 정책에서 실제 빌드 실행</text>
  <text x="72" y="1100" class="heading teal">성공 · 작업 39초</text>

  <path d="M508 1009H605" class="next"/>
  <text x="556" y="980" text-anchor="middle" class="small muted">중지/시작</text>

  <rect x="607" y="891" width="460" height="237" rx="14" fill="#ffffff" stroke="#b4cbee" stroke-width="2"/>
  <rect x="607" y="891" width="460" height="54" rx="14" fill="#e4eeff"/>
  <text x="631" y="927" class="heading blue">2. 같은 IP 재기동 대조</text>
  <text x="631" y="984" class="body">Runner: 동일한 IP</text>
  <text x="631" y="1021" class="body">할당 해제 → 시작 → 자동 연결</text>
  <text x="631" y="1057" class="body">부팅 ID 변경 · 등록 ID 유지</text>
  <text x="631" y="1100" class="heading teal">성공 · 작업 40초</text>

  <path d="M1067 1009H1168" class="next"/>
  <text x="1118" y="980" text-anchor="middle" class="small muted">IP 변경</text>

  <rect x="1170" y="891" width="462" height="237" rx="14" fill="#ffffff" stroke="#e5b86a" stroke-width="2"/>
  <rect x="1170" y="891" width="462" height="54" rx="14" fill="#fff3dc"/>
  <text x="1194" y="927" class="heading orange">3. 새 사설 IP에서 재연결</text>
  <text x="1194" y="984" class="body orange">Runner: 변경 후 IP</text>
  <text x="1194" y="1021" class="body">할당 해제 → NIC IP 변경 → 시작</text>
  <text x="1194" y="1057" class="body">새 NAT 세션 생성 · 재등록 없음</text>
  <text x="1194" y="1100" class="heading teal">성공 · 작업 43초</text>

  <rect x="48" y="1154" width="1584" height="70" rx="12" fill="#dcfce7"/>
  <text x="840" y="1184" text-anchor="middle" class="body teal">통제 조건: NAT·NSG·UDR·공인 IP·등록 정보·디스크·워크플로 유지 / 새 IP도 기존 허용 범위에 포함</text>
  <text x="840" y="1210" text-anchor="middle" class="small teal">오래된 TCP 연결을 새 IP로 옮기는 것이 아니라, 새 연결로 작업 수신과 빌드를 다시 수행함</text>
  <text x="48" y="1256" class="small muted">2026-09-07 실측 · 3회 본 실험 성공 · 빌드 도중 VM 종료나 중단 작업 재개는 미검증 · GHES / Secure Hub 직접 검증 아님</text>
</svg>
