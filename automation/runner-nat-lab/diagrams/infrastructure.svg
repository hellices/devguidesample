<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="760" viewBox="0 0 1680 760" role="img" aria-labelledby="title desc">
  <title id="title">NAT 환경의 Runner 통신 구조</title>
  <desc id="desc">실험의 통신 구조를 역할 중심으로 표시했다. 실제 리소스명, 주소, ID, VM 사양은 생략했다. 공인 IP가 없는 Runner가 기본 경로를 통해 Linux NAT 방화벽으로 HTTPS 요청을 보낸다. NAT는 사설 출발지 주소를 변환하고, Azure 플랫폼의 고정 공인 IP 매핑을 통해 GitHub와 빌드 저장소에 접근한다. 응답은 기존 연결의 역변환으로 돌아온다. Runner의 사설 IP만 기존 허용 범위 안에서 변경하고 등록 정보와 네트워크 정책은 유지했다. GHES나 Secure Hub를 배포한 구성은 아니다.</desc>
  <defs>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
    <marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#0d9488"/></marker>
    <style>
      text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #17233b; }
      .title { font-size: 34px; font-weight: 700; }
      .heading { font-size: 25px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 18px; }
      .muted { fill: #52627a; }
      .blue { fill: #1d4ed8; }
      .teal { fill: #0f766e; }
      .orange { fill: #b45309; }
      .out { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#blue); }
      .back { fill: none; stroke: #0d9488; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#teal); }
    </style>
  </defs>
  <rect width="1680" height="760" fill="#f5f7fb"/>
  <text x="48" y="62" class="title">NAT 환경의 Runner 통신</text>
  <text x="48" y="103" class="body muted">리소스명·주소값 대신 역할과 연결 방향으로 표시</text>
  <path d="M52 143H112" class="out"/>
  <text x="127" y="149" class="small">Runner가 시작하는 요청</text>
  <path d="M520 143H460" class="back"/>
  <text x="540" y="149" class="small">기존 연결의 응답</text>
  <text x="1630" y="149" text-anchor="end" class="small muted">GitHub.com + Linux NAT 실험 기준</text>

  <rect x="40" y="180" width="850" height="400" rx="18" fill="#edf4ff" stroke="#93b4ec"/>
  <text x="64" y="216" class="body blue">사설 네트워크 · 별도 Runner / NAT 서브넷</text>

  <rect x="70" y="248" width="330" height="255" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="235" y="292" text-anchor="middle" class="heading blue">Self-hosted Runner</text>
  <text x="235" y="334" text-anchor="middle" class="body">공인 IP 없음</text>
  <rect x="92" y="355" width="286" height="43" rx="8" fill="#fff3dc"/>
  <text x="235" y="383" text-anchor="middle" class="body orange">변경 전 IP → 변경 후 IP</text>
  <text x="235" y="438" text-anchor="middle" class="body">등록 정보·디스크 유지</text>
  <text x="235" y="475" text-anchor="middle" class="small muted">코드·빌드 실행 위치</text>

  <rect x="530" y="248" width="330" height="255" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="695" y="292" text-anchor="middle" class="heading teal">NAT · 방화벽</text>
  <text x="695" y="334" text-anchor="middle" class="body">Runner 서브넷 범위 허용</text>
  <text x="695" y="382" text-anchor="middle" class="heading teal">사설 출발지 SNAT</text>
  <text x="695" y="438" text-anchor="middle" class="body">응답은 conntrack 역변환</text>
  <text x="695" y="475" text-anchor="middle" class="small muted">NIC·OS IP 전달 활성</text>

  <rect x="950" y="248" width="250" height="255" rx="14" fill="#f1edff" stroke="#a78bfa" stroke-width="2"/>
  <text x="1075" y="292" text-anchor="middle" class="heading">고정 공인 IP</text>
  <text x="1075" y="345" text-anchor="middle" class="body">Azure 플랫폼 매핑</text>
  <text x="1075" y="389" text-anchor="middle" class="small muted">NAT NIC에 연결</text>
  <text x="1075" y="438" text-anchor="middle" class="body">외부 출발지 유지</text>
  <text x="1075" y="475" text-anchor="middle" class="small muted">VNet 외부 리소스</text>

  <rect x="1320" y="210" width="310" height="350" rx="16" fill="#ffffff" stroke="#c6cfde" stroke-width="2"/>
  <text x="1475" y="252" text-anchor="middle" class="heading">외부 서비스</text>
  <rect x="1340" y="275" width="270" height="106" rx="10" fill="#edf2f8"/>
  <text x="1475" y="315" text-anchor="middle" class="heading">GitHub.com</text>
  <text x="1475" y="353" text-anchor="middle" class="small">작업 응답 · 소스 · 로그</text>
  <rect x="1340" y="400" width="270" height="132" rx="10" fill="#edf2f8"/>
  <text x="1475" y="440" text-anchor="middle" class="body">빌드 저장소</text>
  <text x="1475" y="478" text-anchor="middle" class="small muted">이미지 · 패키지</text>
  <text x="1475" y="510" text-anchor="middle" class="small muted">아티팩트 엔드포인트</text>

  <path d="M400 310H530" class="out"/>
  <text x="465" y="290" text-anchor="middle" class="small blue">기본 경로</text>
  <path d="M530 455H400" class="back"/>
  <path d="M860 310H950" class="out"/>
  <path d="M950 455H860" class="back"/>
  <path d="M1200 310H1320" class="out"/>
  <text x="1260" y="290" text-anchor="middle" class="small blue">HTTPS</text>
  <path d="M1320 455H1200" class="back"/>
  <text x="465" y="550" text-anchor="middle" class="small muted">작업 수신용 신규 인바운드 / Runner 대상 DNAT 없음</text>

  <rect x="40" y="610" width="510" height="100" rx="12" fill="#fff3dc"/>
  <text x="64" y="649" class="heading orange">변경</text>
  <text x="64" y="683" class="body">유휴 상태에서 Runner 사설 IP만 변경</text>
  <rect x="570" y="610" width="510" height="100" rx="12" fill="#e5efff"/>
  <text x="594" y="649" class="heading blue">유지</text>
  <text x="594" y="683" class="body">NAT · NSG · UDR · 공인 IP · 등록 정보</text>
  <rect x="1100" y="610" width="530" height="100" rx="12" fill="#dcfce7"/>
  <text x="1124" y="649" class="heading teal">조건</text>
  <text x="1124" y="683" class="body">새 IP도 기존 허용 범위에 포함</text>
  <text x="48" y="744" class="small muted">역할별 구성도 · 실제 주소/정책 증거는 원본 증적 참고 · GHES / Secure Hub 구성과는 구분</text>
</svg>
