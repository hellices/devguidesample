<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1770" viewBox="0 0 1680 1770" role="img" aria-labelledby="title desc">
  <title id="title">GitHub self-hosted runner의 기동, 세션, 작업 수신과 실행 메커니즘</title>
  <desc id="desc">Runner의 작업 수신 흐름과 실제 요청 관측. Listener는 인증과 세션 생성 후 메시지 GET을 반복한다. 노란 구간은 응답이 완료될 때까지의 대기 시간이다. BrokerMessageListener 2.337.0의 유휴 요청은 55~56초 후 HTTP 202로 완료됐다. 작업 도착 사례에서는 12:47:09 UTC에 시작된 GET이, 12:47:36 워크플로 생성 후 12:47:39에 HTTP 200으로 끝났고 12:47:41에 작업이 실행됐다. 중간 반복과 첫 작업은 생략했다. Worker는 같은 호스트에서 IPC로 받은 작업을 실행한다. 실제 요청 관측이며 서버 소스나 TCP 재사용을 확인한 것은 아니다. 등록 정보, Listener 세션, TCP와 NAT 연결은 서로 다르다. 가이드의 적용 전 확인 및 재현·근거·원본 항목 참고.</desc>
  <defs>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
    <marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#0d9488"/></marker>
    <marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <style>
      text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #17233b; }
      .title { font-size: 34px; font-weight: 700; }
      .heading { font-size: 24px; font-weight: 700; }
      .body { font-size: 20px; }
      .small { font-size: 18px; }
      .muted { fill: #52627a; }
      .blue { fill: #1d4ed8; }
      .teal { fill: #0f766e; }
      .orange { fill: #b45309; }
      .out { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#blue); }
      .back { fill: none; stroke: #0d9488; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#teal); }
      .local { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#gray); }
    </style>
  </defs>
  <rect width="1680" height="1770" fill="#f5f7fb"/>
  <text x="48" y="62" class="title">Self-hosted runner는 어떻게 작업을 받는가?</text>
  <text x="48" y="100" class="body muted">유휴 GET: 55~56초 후 202 · 작업 도착: 진행 중 GET이 30초 후 200</text>
  <rect x="48" y="123" width="1584" height="50" rx="10" fill="#e6f7f2"/>
  <text x="840" y="155" text-anchor="middle" class="body teal">GitHub → Runner: 새 인바운드 접속이 아니라 Runner 요청에 대한 응답</text>

  <rect x="48" y="193" width="1584" height="80" rx="12" fill="#fff3dc" stroke="#e5b86a"/>
  <text x="72" y="227" class="heading orange">0. 최초 등록 — 기동할 때마다 반복하지 않음</text>
  <text x="72" y="255" class="body">config.sh + 등록 토큰 → 등록 정보 저장 · 실행 중 세션과 구분</text>

  <rect x="48" y="293" width="1584" height="1145" rx="18" fill="#ffffff" stroke="#d7dfeb"/>
  <rect x="76" y="315" width="780" height="1065" rx="14" fill="#f8faff" stroke="#b4cbee" stroke-dasharray="7 5"/>
  <text x="98" y="344" class="small blue">Runner VM · 공인 IP 없음 · 등록 정보를 유지하는 상주형 Runner</text>

  <rect x="110" y="366" width="300" height="68" rx="10" fill="#edf2f8" stroke="#c6cfde"/>
  <text x="260" y="396" text-anchor="middle" class="heading">Runner.Worker</text>
  <text x="260" y="420" text-anchor="middle" class="small muted">작업 수신 후 생성</text>
  <rect x="490" y="366" width="340" height="68" rx="10" fill="#e4eeff" stroke="#93b4ec"/>
  <text x="660" y="396" text-anchor="middle" class="heading blue">Runner.Listener</text>
  <text x="660" y="420" text-anchor="middle" class="small">상주 프로세스 · 메시지 수신/전달</text>
  <rect x="906" y="366" width="280" height="68" rx="10" fill="#dff7ed" stroke="#99d4bd"/>
  <text x="1046" y="396" text-anchor="middle" class="heading teal">NAT · 방화벽</text>
  <text x="1046" y="420" text-anchor="middle" class="small">SNAT / 반환 연결 역변환</text>
  <rect x="1270" y="366" width="330" height="68" rx="10" fill="#edf2f8" stroke="#c6cfde"/>
  <text x="1435" y="396" text-anchor="middle" class="heading">GitHub Actions 서비스</text>
  <text x="1435" y="420" text-anchor="middle" class="small">인증 · 메시지 API · 작업 배정</text>

  <path d="M660 434V1364M1046 434V1364M1435 434V1364" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 6"/>
  <rect x="490" y="454" width="340" height="46" rx="8" fill="#e4eeff"/>
  <text x="660" y="484" text-anchor="middle" class="body blue">1. 서비스 또는 run.sh로 기동</text>
  <text x="874" y="483" class="small muted">서비스 자동 기동 또는 직접 실행</text>

  <text x="853" y="535" text-anchor="middle" class="body blue">2. 인증 + Listener 세션 생성</text>
  <text x="1240" y="535" text-anchor="middle" class="body blue">Runner가 outbound HTTPS 시작</text>
  <path d="M660 550H1046" class="out"/>
  <path d="M1046 550H1435" class="out"/>
  <path d="M1435 590H1046" class="back"/>
  <path d="M1046 590H660" class="back"/>
  <text x="1046" y="618" text-anchor="middle" class="small teal">인증·세션 응답 (여러 요청을 묶어 표시)</text>

  <rect x="110" y="650" width="450" height="465" rx="12" fill="#ffffff" stroke="#e5b86a"/>
  <text x="132" y="688" class="heading orange">“계속 연결”의 정확한 의미</text>
  <text x="132" y="732" class="body">응답 대기 중: 연결 유지</text>
  <text x="132" y="779" class="body">응답 완료 후: 다음 요청</text>
  <text x="132" y="826" class="body">단일 영구 TCP 연결은 아님</text>
  <path d="M132 870H538" fill="none" stroke="#d7dfeb"/>
  <text x="132" y="905" class="body blue">새 HTTP 요청 ≠ 항상 새 TCP 연결</text>
  <text x="132" y="950" class="small muted">기존 연결 재사용 또는 새 연결</text>
  <text x="132" y="1006" class="small muted">실측 범위: HTTP 요청 단위</text>
  <text x="132" y="1036" class="small muted">서버 소스·TCP 재사용은 미확인</text>
  <rect x="132" y="1067" width="22" height="22" rx="3" fill="#fff3dc" stroke="#e5b86a"/>
  <text x="166" y="1084" class="small orange">노란 구간 = 요청이 완료되지 않은 시간</text>

  <rect x="667" y="694" width="761" height="97" rx="8" fill="#fff3dc" stroke="#e5b86a"/>
  <rect x="653" y="676" width="14" height="158" rx="4" fill="#e5b86a"/>
  <rect x="1428" y="676" width="14" height="158" rx="4" fill="#e5b86a"/>
  <text x="853" y="657" text-anchor="middle" class="body blue">3-A. 유휴 사례: 메시지 GET</text>
  <text x="1240" y="657" text-anchor="middle" class="body blue">HTTPS / TCP 443</text>
  <path d="M660 676H1046" class="out"/>
  <path d="M1046 676H1435" class="out"/>
  <text x="1046" y="732" text-anchor="middle" class="body orange">실측: 요청 시작부터 완료까지 55~56초 대기</text>
  <text x="1046" y="765" text-anchor="middle" class="body orange">즉시 응답을 받은 뒤 55초 쉬는 방식과 구분</text>
  <text x="1046" y="818" text-anchor="middle" class="body teal">HTTP 202로 요청 완료 → 다음 GET 시작</text>
  <path d="M1435 834H1046" class="back"/>
  <path d="M1046 834H660" class="back"/>
  <text x="1046" y="868" text-anchor="middle" class="small muted">요청 완료 ≠ 반드시 TCP 연결 종료 · 다음 HTTP 요청에서 기존 TCP 재사용 가능</text>

  <rect x="667" y="956" width="761" height="70" rx="8" fill="#fff3dc" stroke="#e5b86a"/>
  <rect x="653" y="938" width="14" height="241" rx="4" fill="#e5b86a"/>
  <rect x="1428" y="938" width="14" height="241" rx="4" fill="#e5b86a"/>
  <text x="853" y="916" text-anchor="middle" class="body blue">3-B. GET 시작: 12:47:09 UTC</text>
  <text x="1240" y="916" text-anchor="middle" class="small blue">사례 발췌 · 중간 반복/첫 작업 생략</text>
  <path d="M660 938H1046" class="out"/>
  <path d="M1046 938H1435" class="out"/>
  <text x="1046" y="985" text-anchor="middle" class="body orange">요청 대기 중 워크플로 실행</text>
  <text x="1046" y="1013" text-anchor="middle" class="small orange">요청 시작/완료 로그를 짝지어 비교 · TCP 패킷 복원은 아님</text>

  <rect x="1134" y="1060" width="466" height="76" rx="10" fill="#edf2f8" stroke="#c6cfde"/>
  <text x="1154" y="1089" class="body">4. 12:47:36 UTC 워크플로 생성</text>
  <text x="1154" y="1119" class="small">레이블·그룹 일치 + 온라인·유휴 Runner</text>
  <text x="1046" y="1162" text-anchor="middle" class="body teal">5. 12:47:39 UTC · 진행 중 GET이 30초 후 HTTP 200으로 완료</text>
  <path d="M1435 1179H1046" class="back"/>
  <path d="M1046 1179H660" class="back"/>
  <text x="681" y="1208" class="small muted">작업 참조를 받으면 Listener가 별도 요청으로 본문 조회</text>

  <g transform="translate(0 320)">
  <text x="460" y="901" text-anchor="middle" class="body">6. Worker 실행 · 12:47:41 작업 시작</text>
  <path d="M660 918H260" class="local"/>
  <rect x="110" y="937" width="440" height="66" rx="10" fill="#e4eeff" stroke="#93b4ec"/>
  <text x="132" y="966" class="heading blue">Worker: 같은 VM에서 단계 실행</text>
  <text x="132" y="991" class="small">이 실험: checkout · Docker/Oryx · Flask 검사</text>

  <text x="823" y="1025" text-anchor="middle" class="body blue">7. 로그·결과 전송 · 아티팩트는 사용 시 해당 엔드포인트로</text>
  <path d="M260 1003V1043H1046" class="out"/>
  <path d="M1046 1043H1435" class="out"/>
  <text x="840" y="1093" text-anchor="middle" class="body muted">상주형: 완료 후 다음 작업 대기 · --ephemeral: 작업 하나 처리 후 등록 해제</text>

  <path d="M52 1150H112" class="out"/>
  <text x="127" y="1156" class="small">Runner에서 시작하는 외부 요청</text>
  <path d="M566 1150H506" class="back"/>
  <text x="586" y="1156" class="small">해당 요청의 응답 · 신규 인바운드 아님</text>
  <path d="M1105 1150H1165" class="local"/>
  <text x="1180" y="1156" class="small">VM 내부 프로세스 실행/IPC</text>

  <rect x="48" y="1180" width="506" height="118" rx="12" fill="#ffffff" stroke="#b4cbee"/>
  <text x="70" y="1216" class="heading blue">Runner 등록 정보</text>
  <text x="70" y="1249" class="body">디스크에 저장 · Runner ID/인증 정보</text>
  <text x="70" y="1278" class="small muted">재기동/IP 변경에도 같은 등록 정보 유지</text>
  <rect x="587" y="1180" width="506" height="118" rx="12" fill="#ffffff" stroke="#b4cbee"/>
  <text x="609" y="1216" class="heading blue">Listener 세션</text>
  <text x="609" y="1249" class="body">Actions 서비스와의 논리적 수신 상태</text>
  <text x="609" y="1278" class="small muted">Listener 재기동 시 다시 인증·세션 생성</text>
  <rect x="1126" y="1180" width="506" height="118" rx="12" fill="#ffffff" stroke="#e5b86a"/>
  <text x="1148" y="1216" class="heading orange">TCP / NAT 연결 상태</text>
  <text x="1148" y="1249" class="body">개별 연결 · 주소/포트 매핑 · conntrack</text>
  <text x="1148" y="1278" class="small muted">새 IP에서 새 연결 · 이전 연결의 이동 아님</text>

  <rect x="48" y="1318" width="1584" height="47" rx="10" fill="#e6f7f2"/>
  <text x="840" y="1349" text-anchor="middle" class="body teal">새 IP의 요청·반환 경로 허용 → 작업 수신 가능 · 중단 작업의 무중단 재개는 미검증</text>
  <text x="48" y="1392" class="small muted">BrokerMessageListener 2.337.0 · UTC / 1초 해상도 · 원본과 코드는 가이드의 ‘재현·근거·원본’ 참고</text>
  <text x="48" y="1420" class="small muted">관측값 ≠ 고정 대기 시간 · 서버 내부 구현과 TCP 재사용은 미확인</text>
  </g>
</svg>
