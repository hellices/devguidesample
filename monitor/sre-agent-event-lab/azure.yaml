name: sre-agent-event-lab
infra:
  provider: bicep
  path: infra
  module: main
hooks:
  preprovision:
    shell: sh
    run: ./scripts/azd-configure.sh
    interactive: true
    continueOnError: false
  postprovision:
    shell: sh
    run: ./scripts/azd-postprovision-local.sh
    interactive: true
    continueOnError: false
  postdeploy:
    shell: sh
    run: ./scripts/azd-deploy-app.sh
    interactive: true
    continueOnError: false
  predown:
    shell: sh
    run: ./scripts/cleanup-external.sh --yes
    interactive: true
    continueOnError: false
  postdown:
    shell: sh
    run: ./scripts/cleanup-external.sh --reset-image-env --yes
    interactive: true
    continueOnError: false
