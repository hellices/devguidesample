# Release tag vX.Y.Z: test, build the image on a GitHub-hosted runner, push it to GHCR and attest its provenance.
# The step summary prints the ref, commit and image values that the documentation's sample.yml pins.
# GHCR repository names must be lowercase, so keep the GitHub owner and repository names lowercase.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # Docker tags cannot carry SemVer build metadata ("+..."), and the documentation's sample.yml rejects it, so
      # stop before publishing anything for such a tag.
      - name: Reject build metadata in the release tag
        run: |
          case "${GITHUB_REF_NAME}" in
            *+*) echo "::error::Release tags must not contain SemVer build metadata: ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Values for the documentation sample.yml
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo '```yaml'
            echo "ref: ${GITHUB_REF_NAME}"
            # The checked-out HEAD is the commit the tag points at, also for an annotated tag.
            echo "commit: $(git rev-parse HEAD)"
            echo "image: ghcr.io/${GITHUB_REPOSITORY}:${VERSION}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
