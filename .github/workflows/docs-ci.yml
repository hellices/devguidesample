name: Documentation CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Run documentation contract tests
        run: python -m pytest tests/docs -q

      - name: Validate public documentation
        run: |
          python scripts/docs/validate_metadata.py
          python scripts/docs/validate_sources.py
          python scripts/docs/validate_links.py
          python scripts/docs/validate_public_safety.py

      - name: Build site strictly
        run: mkdocs build --strict

      - name: Validate search index
        run: python scripts/docs/validate_search_index.py
