name: docs

on:
  push:
    branches: [main]
    paths: ['**.md', 'scripts/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['**.md', 'scripts/**', '.github/workflows/docs.yml']

permissions:
  contents: write

jobs:
  # main에 머지되면 루트 README의 인덱스를 다시 만들어 자동 커밋한다.
  # 문서를 추가한 사람이 README를 손으로 고칠 필요가 없다.
  index:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 인덱스 재생성
        run: python3 scripts/gen_index.py

      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md 인덱스가 최신입니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: README 인덱스 자동 갱신"
          git push

  # PR에서는 이번에 바뀐 문서만 본다. 과거 문서의 문제로 새 PR이 막히지 않게.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 인덱스는 여기서 검사하지 않는다. 머지되면 index 잡이 알아서 갱신한다.
      - name: 바뀐 문서 검사
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.md')
          if [ -z "$changed" ]; then
            echo "검사할 문서 변경이 없습니다."
            exit 0
          fi
          echo "$changed"
          # shellcheck disable=SC2086
          python3 scripts/check_docs.py $changed
