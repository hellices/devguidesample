site_name: Azure Engineering Notes
site_description: Azure 기반 시스템의 설계·구현·운영 기록
site_url: https://caldova-kr.github.io/devguidesample/
repo_url: https://github.com/caldova-kr/devguidesample
repo_name: caldova-kr/devguidesample
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true
exclude_docs: |
  services/**/samples/**

validation:
  links:
    anchors: warn

theme:
  name: material
  language: ko
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  features:
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 어두운 테마로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 밝은 테마로 전환

plugins:
  - search:
      lang:
        - ko
        - en
  - tags:
      tags: false
      listings: false
  - gen-files:
      scripts:
        - scripts/docs/generate_indexes.py
  - awesome-nav

hooks:
  - scripts/docs/hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/explore.js
  - assets/javascripts/sidebar-toggle.js
  - assets/javascripts/daily-updates.js
  - assets/javascripts/search-input.js

copyright: Copyright &copy; Azure Engineering Notes contributors
extra:
  # 저장소 이전 전 site_url. RSS 구독자가 이미 읽은 항목을 새 글로 보지 않도록 GUID를 이 주소 기준으로 고정한다.
  feed_guid_base_url: https://hellices.github.io/devguidesample/
