# Shared env ConfigMap — common across all bench Jobs
apiVersion: v1
kind: ConfigMap
metadata:
  name: bench-env
data:
  SEARCH_URL: "https://<search-service-name>.search.windows.net"
  VLLM_EMBED_URL: "http://vllm-embedding-svc:8081"
  EMBED_SKILL_URI: "https://embed.example.com/api/embed"
  STORAGE_ACCOUNT: "<storage-account-name>"
  STORAGE_RG: "<storage-resource-group>"
  BLOB_CONTAINER: "bench-docs"
  EMBED_MODEL: "Qwen/Qwen3-Embedding-4B"
  VECTOR_DIM: "2560"
  STORAGE_RESOURCE_ID: "/subscriptions/<subscription-id>/resourceGroups/<storage-resource-group>/providers/Microsoft.Storage/storageAccounts/<storage-account-name>"
---
# Secret — API key (create manually: kubectl create secret generic bench-secrets --from-literal=SEARCH_API_KEY=xxx)
# apiVersion: v1
# kind: Secret
# metadata:
#   name: bench-secrets
# stringData:
#   SEARCH_API_KEY: "<your-key>"
