# TARGET_URL과 HOST_HEADER를 바꿔 같은 부하를 Service, HTTP Add-on interceptor, AGC frontend에 보냅니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
  namespace: demo
data:
  script.js: |
    import http from 'k6/http';
    export const options = {
      scenarios: {
        ramp: {
          executor: 'ramping-arrival-rate',
          startRate: 0, timeUnit: '1s', preAllocatedVUs: 200, maxVUs: 1000,
          stages: [
            { target: 400, duration: '1m' },
            { target: 400, duration: '5m' },
            { target: 0, duration: '30s' },
          ],
        },
      },
    };
    const headers = __ENV.HOST_HEADER ? { Host: __ENV.HOST_HEADER } : {};
    export default function () { http.get(__ENV.TARGET_URL, { headers, timeout: '10s' }); }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6
  namespace: demo
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.azure.com/mode: system
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
      containers:
        - name: k6
          image: grafana/k6:1.8.2
          args: ["run", "--summary-trend-stats=avg,p(95),p(99)", "/scripts/script.js"]
          env:
            - name: TARGET_URL
              value: http://podinfo.demo.svc/
            - name: HOST_HEADER
              value: ""
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-script
