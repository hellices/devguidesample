# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: aks-keda-request-scaling
infra:
  provider: bicep
  path: infra
  module: main
hooks:
  # 클러스터 생성 뒤 add-on, KEDA 관리 ID 연결, 앱, HTTP Add-on, AGC Gateway를 준비합니다.
  postprovision:
    shell: sh
    run: ./hooks/postprovision.sh
    interactive: true
  # PATTERN 환경 값에 지정한 패턴으로 부하를 주고 결과를 out/<azd 환경>/에 남깁니다.
  postdeploy:
    shell: sh
    run: ./hooks/postdeploy.sh
    interactive: true
