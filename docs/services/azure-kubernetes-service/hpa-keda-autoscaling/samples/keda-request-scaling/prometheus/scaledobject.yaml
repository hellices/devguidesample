# <keda-client-id>: Bicep 출력 KEDA_CLIENT_ID(azd env get-value KEDA_CLIENT_ID)
# <amw-query-endpoint>: Bicep 출력 AMW_QUERY_ENDPOINT(az monitor account show --query metrics.prometheusQueryEndpoint와 같은 값)
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: azure-wi
  namespace: demo
spec:
  podIdentity:
    provider: azure-workload
    identityId: <keda-client-id>
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: podinfo
  namespace: demo
spec:
  scaleTargetRef:
    name: podinfo
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 120
  triggers:
    - type: prometheus
      # Azure Managed Prometheus 인증은 TriggerAuthentication의 azure-workload가 맡습니다. KEDA Prometheus scaler 문서는
      # Azure Workload Identity와 함께 다른 authModes를 지정할 수 없다고 하므로 authModes를 두지 않습니다.
      authenticationRef:
        name: azure-wi
      metadata:
        serverAddress: <amw-query-endpoint>
        # probe·scrape를 제외한 앱 요청(path="root")만 세고, Pod 하나가 초당 50건을 처리하도록 맞춥니다.
        query: sum(rate(http_request_duration_seconds_count{namespace="demo", path="root"}[1m]))
        threshold: "50"
