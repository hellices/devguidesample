# 1순위 pref64(Standard_D64ds_v7, Ddsv7 계열)와 다른 계열의 대체 alt(Standard_D4as_v7, Dasv7 계열)
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: pref64
spec:
  weight: 100
  limits: {cpu: "128"}
  disruption: {consolidationPolicy: WhenEmptyOrUnderutilized, consolidateAfter: 0s, budgets: [{nodes: "100%"}]}
  template:
    metadata:
      labels: {bench: stale, kubernetes.azure.com/ebpf-dataplane: cilium}
    spec:
      expireAfter: Never
      requirements:
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
        - {key: karpenter.azure.com/sku-name, operator: In, values: [Standard_D64ds_v7]}
      startupTaints:
        - {key: node.cilium.io/agent-not-ready, effect: NoExecute, value: "true"}
      nodeClassRef: {group: karpenter.azure.com, kind: AKSNodeClass, name: default}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: alt
spec:
  weight: 10
  limits: {cpu: "40"}
  disruption: {consolidationPolicy: WhenEmptyOrUnderutilized, consolidateAfter: 0s, budgets: [{nodes: "100%"}]}
  template:
    metadata:
      labels: {bench: stale, kubernetes.azure.com/ebpf-dataplane: cilium}
    spec:
      expireAfter: Never
      requirements:
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
        - {key: karpenter.azure.com/sku-name, operator: In, values: [Standard_D4as_v7]}
      startupTaints:
        - {key: node.cilium.io/agent-not-ready, effect: NoExecute, value: "true"}
      nodeClassRef: {group: karpenter.azure.com, kind: AKSNodeClass, name: default}
