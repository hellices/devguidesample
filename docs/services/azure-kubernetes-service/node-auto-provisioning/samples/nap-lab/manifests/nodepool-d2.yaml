# B2: 2 vCPU VM 40대를 한 번에 만드는 대규모 burst
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: d2
spec:
  limits: {cpu: "80"}
  disruption: {consolidationPolicy: WhenEmptyOrUnderutilized, consolidateAfter: 0s, budgets: [{nodes: "100%"}]}
  template:
    metadata:
      labels: {bench: d2, kubernetes.azure.com/ebpf-dataplane: cilium}
    spec:
      expireAfter: Never
      requirements:
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
        - {key: karpenter.azure.com/sku-name, operator: In, values: [Standard_D2ds_v7]}
      startupTaints:
        - {key: node.cilium.io/agent-not-ready, effect: NoExecute, value: "true"}
      nodeClassRef: {group: karpenter.azure.com, kind: AKSNodeClass, name: default}
