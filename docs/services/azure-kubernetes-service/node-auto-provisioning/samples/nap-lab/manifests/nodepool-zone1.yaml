# B1: CAS zone 1 VMSS 풀과 같은 조건(Standard_D4ds_v7, zone 1)
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: zone1
spec:
  limits: {cpu: "40"}
  disruption: {consolidationPolicy: WhenEmptyOrUnderutilized, consolidateAfter: 0s, budgets: [{nodes: "30%"}]}
  template:
    metadata:
      labels: {bench: zone1, kubernetes.azure.com/ebpf-dataplane: cilium}
    spec:
      expireAfter: Never
      requirements:
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
        - {key: karpenter.azure.com/sku-name, operator: In, values: [Standard_D4ds_v7]}
        - {key: topology.kubernetes.io/zone, operator: In, values: [eastus2-1]}
      startupTaints:
        - {key: node.cilium.io/agent-not-ready, effect: NoExecute, value: "true"}
      nodeClassRef: {group: karpenter.azure.com, kind: AKSNodeClass, name: default}
