# NAP가 weight가 높은 pref-big(Standard_D96ds_v7)을 먼저 고르고,
# 생성에 실패하면 fallback(Standard_D4ds_v7)으로 넘어가는지 확인합니다.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: pref-big
spec:
  weight: 100
  limits:
    cpu: "200"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 0s
    budgets:
      - nodes: "100%"
  template:
    metadata:
      labels:
        bench: q
        kubernetes.azure.com/ebpf-dataplane: cilium
    spec:
      expireAfter: Never
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: karpenter.azure.com/sku-name
          operator: In
          values: [Standard_D96ds_v7]
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          effect: NoExecute
          value: "true"
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: default
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: fallback
spec:
  weight: 10
  limits:
    cpu: "40"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 0s
    budgets:
      - nodes: "100%"
  template:
    metadata:
      labels:
        bench: q
        kubernetes.azure.com/ebpf-dataplane: cilium
    spec:
      expireAfter: Never
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: karpenter.azure.com/sku-name
          operator: In
          values: [Standard_D4ds_v7]
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          effect: NoExecute
          value: "true"
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: default
