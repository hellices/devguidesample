# Dedicated OpenTelemetry Collector Contrib configuration for Azure Event Hubs
# Solves single-VM gateway in-memory queue delays and silent metric drops by:
#   1. Separating Azure Monitor platform metric scraping (azuremonitorreceiver, 60s grain)
#      from high-frequency Kafka consumer lag scraping (kafkametricsreceiver, 15s grain).
#   2. Enforcing memory_limiter + persistent/sized sending_queue with Prometheus self-telemetry.
#   3. Forwarding normalized series via prometheusremotewrite to VictoriaMetrics (vminsert).

receivers:
  # 1) Azure Monitor platform metrics for Event Hubs Dedicated Cluster / Premium / Standard Namespace
  azuremonitor:
    subscription_ids:
      - "${env:AZURE_SUBSCRIPTION_ID}"
    auth: "managed_identity"
    collection_interval: 60s
    resource_groups:
      - "${env:AZURE_RESOURCE_GROUP}"
    services:
      - "Microsoft.EventHub/clusters"
      - "Microsoft.EventHub/namespaces"
    metrics:
      Microsoft.EventHub/clusters:
        - "CPU"
        - "AvailableMemory"
        - "ClusterUtilization"
        - "IncomingBytes"
        - "IncomingMessages"
        - "IncomingRequests"
        - "OutgoingBytes"
        - "OutgoingMessages"
        - "ThrottledRequests"
        - "SuccessfulRequests"
        - "ServerErrors"
        - "QuotaExceededErrors"
      Microsoft.EventHub/namespaces:
        - "NamespaceCpuUsage"
        - "NamespaceMemoryUsage"
        - "IncomingBytes"
        - "IncomingMessages"
        - "IncomingRequests"
        - "OutgoingBytes"
        - "OutgoingMessages"
        - "ThrottledRequests"
        - "SuccessfulRequests"
        - "ServerErrors"
        - "UserErrors"
        - "ActiveConnections"

  # 2) Kafka protocol receiver for Event Hubs partition offsets & Consumer Group Lag
  kafkametrics:
    brokers:
      - "${env:EVENTHUB_NAMESPACE}.servicebus.windows.net:9093"
    protocol_version: "2.0.0"
    scrapers:
      - brokers
      - topics
      - consumers
    collection_interval: 15s
    topic_match: "^telemetry-.*"
    auth:
      sasl:
        username: "$ConnectionString"
        password: "${env:EVENTHUB_CONNECTION_STRING}"
        mechanism: "PLAIN"
      tls:
        insecure: false

  # 3) Self-observability scraper to monitor OTel in-memory queue size & dropped points
  prometheus/internal:
    config:
      scrape_configs:
        - job_name: "otel-collector-self"
          scrape_interval: 10s
          static_configs:
            - targets: ["127.0.0.1:8888"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 15

  # Attach static capacity metadata labels used by Effective Capacity Utilization (%) PromQL
  resource/capacity_metadata:
    attributes:
      - key: eh_tier
        value: "${env:EH_TIER}"
        action: upsert
      - key: eh_allocated_units
        value: "${env:EH_ALLOCATED_UNITS}"
        action: upsert
      - key: eh_partition_count
        value: "${env:EH_PARTITION_COUNT}"
        action: upsert

  batch/azuremonitor:
    send_batch_size: 2048
    send_batch_max_size: 4096
    timeout: 5s

  batch/kafkalag:
    send_batch_size: 4096
    send_batch_max_size: 8192
    timeout: 2s

exporters:
  prometheusremotewrite/victoriametrics:
    endpoint: "${env:VMINSERT_ENDPOINT}"
    resource_to_telemetry_conversion:
      enabled: true
    remote_write_queue:
      enabled: true
      queue_size: 10000
      num_consumers: 8
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 15s
      max_elapsed_time: 120s

service:
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    metrics/azure_platform:
      receivers: [azuremonitor]
      processors: [memory_limiter, resource/capacity_metadata, batch/azuremonitor]
      exporters: [prometheusremotewrite/victoriametrics]
    metrics/kafka_lag_and_self:
      receivers: [kafkametrics, prometheus/internal]
      processors: [memory_limiter, resource/capacity_metadata, batch/kafkalag]
      exporters: [prometheusremotewrite/victoriametrics]
