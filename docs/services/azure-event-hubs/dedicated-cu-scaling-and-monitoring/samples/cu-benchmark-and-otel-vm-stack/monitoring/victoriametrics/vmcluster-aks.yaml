# Production AKS architecture for high-cardinality Event Hubs + Kafka telemetry monitoring
# Separates OTel Collector gateways (Azure Monitor platform scraper vs Kafka offset/lag scraper)
# and scales VictoriaMetrics in cluster mode (vminsert / vmstorage / vmselect).
apiVersion: v1
kind: Namespace
metadata:
  name: eh-observability
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vmstorage
  namespace: eh-observability
spec:
  serviceName: vmstorage
  replicas: 2
  selector:
    matchLabels:
      app: vmstorage
  template:
    metadata:
      labels:
        app: vmstorage
    spec:
      containers:
        - name: vmstorage
          image: victoriametrics/vmstorage:v1.106.1-cluster
          args:
            - "-storageDataPath=/vmstorage-data"
            - "-retentionPeriod=90d"
            - "-vminsertAddr=:8400"
            - "-vmselectAddr=:8401"
          ports:
            - containerPort: 8482
              name: http
            - containerPort: 8400
              name: vminsert
            - containerPort: 8401
              name: vmselect
          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
            limits:
              cpu: "2000m"
              memory: "8Gi"
          volumeMounts:
            - name: storage
              mountPath: /vmstorage-data
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi-premium
        resources:
          requests:
            storage: 256Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vmstorage
  namespace: eh-observability
spec:
  clusterIP: None
  selector:
    app: vmstorage
  ports:
    - name: vminsert
      port: 8400
    - name: vmselect
      port: 8401
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vminsert
  namespace: eh-observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vminsert
  template:
    metadata:
      labels:
        app: vminsert
    spec:
      containers:
        - name: vminsert
          image: victoriametrics/vminsert:v1.106.1-cluster
          args:
            - "-storageNode=vmstorage-0.vmstorage.eh-observability.svc.cluster.local:8400"
            - "-storageNode=vmstorage-1.vmstorage.eh-observability.svc.cluster.local:8400"
            - "-maxLabelsPerTimeseries=40"
          ports:
            - containerPort: 8480
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: vminsert
  namespace: eh-observability
spec:
  selector:
    app: vminsert
  ports:
    - name: http
      port: 8480
      targetPort: 8480
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmselect
  namespace: eh-observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vmselect
  template:
    metadata:
      labels:
        app: vmselect
    spec:
      containers:
        - name: vmselect
          image: victoriametrics/vmselect:v1.106.1-cluster
          args:
            - "-storageNode=vmstorage-0.vmstorage.eh-observability.svc.cluster.local:8401"
            - "-storageNode=vmstorage-1.vmstorage.eh-observability.svc.cluster.local:8401"
          ports:
            - containerPort: 8481
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: vmselect
  namespace: eh-observability
spec:
  selector:
    app: vmselect
  ports:
    - name: http
      port: 8481
      targetPort: 8481
