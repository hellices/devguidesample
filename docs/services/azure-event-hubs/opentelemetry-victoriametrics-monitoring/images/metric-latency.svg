  <text x="24" y="354" fill="#4A5568" font-size="12">Premium bin은 이벤트가 속한 분보다 1분 뒤 timestamp로, Standard는 2분 단위 bin으로 기록됨. 막대는 최소–최대, 검은 선은 중앙값. 측정 resolution ±10초.</text>
