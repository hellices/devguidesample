<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 364" width="1220" height="364" role="img" aria-labelledby="latTitle latDesc" font-family="'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif" font-size="13">
  <title id="latTitle">Azure Monitor와 OpenTelemetry Collector 경유 지표 지연 실측</title>
  <desc id="latDesc">이벤트를 보낸 시각을 0초로 할 때, Premium 1 PU에서는 Azure Monitor Metrics API에서 72–102초(중앙값 92초), OpenTelemetry Collector를 거쳐 VictoriaMetrics에서 230–232초 뒤 조회됨. Standard 1 TU는 2분 bin으로 Metrics API 81–151초, VictoriaMetrics 221–281초. Collector 구간은 130–160초.</desc>
