<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 470" width="1220" height="470" role="img" aria-labelledby="latTitle latDesc" font-family="'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif" font-size="13">
  <title id="latTitle">Azure Monitor와 OpenTelemetry Collector 경유 지표 지연 실측</title>
  <desc id="latDesc">이벤트를 보낸 시각을 0초로 할 때, Dedicated 1 CU cluster의 namespace에서는 Azure Monitor Metrics API에서 71–101초(중앙값 81초), 배포한 OpenTelemetry Collector Gateway를 거쳐 VictoriaMetrics에서 190–261초(중앙값 201초) 뒤 조회됨. 같은 receiver 설정의 로컬 Collector로 잰 Premium 1 PU는 72–102초와 230–232초, Standard 1 TU는 2분 bin으로 81–151초와 221–281초. Collector 구간은 100–160초.</desc>
