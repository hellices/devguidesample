apiVersion: v1
kind: ServiceAccount
metadata:
  name: eventhubs-producer
  namespace: eventhubs-observability
  annotations:
    azure.workload.identity/client-id: __PRODUCER_CLIENT_ID__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eventhubs-slow-consumer
  namespace: eventhubs-observability
  annotations:
    azure.workload.identity/client-id: __CONSUMER_CLIENT_ID__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventhubs-producer
  namespace: eventhubs-observability
spec:
  replicas: 0
  selector:
    matchLabels:
      app: eventhubs-producer
  template:
    metadata:
      labels:
        app: eventhubs-producer
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: eventhubs-producer
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: producer
          image: __WORKLOAD_IMAGE__
          command: ["python", "producer.py"]
          env:
            - name: EVENT_HUB_NAMESPACE
              value: __EVENT_HUB_NAMESPACE__
            - name: EVENT_HUB_NAME
              value: __EVENT_HUB_NAME__
            - name: EVENTS_PER_SECOND
              value: "200"
            - name: PAYLOAD_BYTES
              value: "1024"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventhubs-slow-consumer
  namespace: eventhubs-observability
spec:
  # No replicas field: creation defaults to 1 and later applies never scale a running consumer.
  selector:
    matchLabels:
      app: eventhubs-slow-consumer
  template:
    metadata:
      labels:
        app: eventhubs-slow-consumer
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: eventhubs-slow-consumer
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consumer
          image: __WORKLOAD_IMAGE__
          command: ["python", "consumer.py"]
          env:
            - name: EVENT_HUB_NAMESPACE
              value: __EVENT_HUB_NAMESPACE__
            - name: EVENT_HUB_NAME
              value: __EVENT_HUB_NAME__
            - name: EVENT_HUB_CONSUMER_GROUP
              value: __EVENT_HUB_CONSUMER_GROUP__
            - name: CHECKPOINT_STORAGE_URL
              value: __CHECKPOINT_ACCOUNT_URL__
            - name: CHECKPOINT_CONTAINER
              value: workload-checkpoints
            - name: PROCESSING_DELAY_SECONDS
              value: "0.03"
            - name: CHECKPOINT_EVERY
              value: "20"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
