<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 680" role="img" aria-labelledby="title desc">
  <title id="title">APIM native proxy for an existing Microsoft Learn MCP server</title>
  <desc id="desc">Private clients authenticate to APIM with Entra. APIM uses a native MCP API and explicit backendId binding, removes Authorization, and connects to the existing anonymous Learn MCP endpoint.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34536f"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#162b40;font-size:20px}.title{font-size:28px;font-weight:700}.small{font-size:18px}.box{fill:#edf5ff;stroke:#2565a4;stroke-width:2}.external{fill:#eef8f1;stroke:#327449;stroke-width:2}.flow{fill:none;stroke:#34536f;stroke-width:2.5;marker-end:url(#arrow)}.boundary{fill:#f8fafc;stroke:#8397aa;stroke-width:2;stroke-dasharray:8 6}</style>
  <rect width="1160" height="680" fill="white"/>
  <text x="30" y="45" class="title">Existing MCP proxy: Entra at the front, anonymous Learn at the back</text>
  <rect x="325" y="125" width="470" height="435" rx="18" class="boundary"/>
  <text x="345" y="160">Private APIM gateway</text>
  <rect x="35" y="250" width="235" height="135" rx="12" class="box"/>
  <text x="152" y="292" text-anchor="middle"><tspan x="152">Developer MCP client</tspan><tspan x="152" dy="34" class="small">Entra user token</tspan><tspan x="152" dy="29" class="small">TLS / private route</tspan></text>
  <rect x="365" y="205" width="390" height="120" rx="12" class="box"/>
  <text x="560" y="244" text-anchor="middle"><tspan x="560">Validate intended MCP audience</tspan><tspan x="560" dy="32" class="small">Require approved client + scope</tspan><tspan x="560" dy="28" class="small">Remove outbound Authorization</tspan></text>
  <rect x="365" y="380" width="390" height="135" rx="12" class="box"/>
  <text x="560" y="418" text-anchor="middle"><tspan x="560">Native MCP passthrough API</tspan><tspan x="560" dy="32" class="small">backendId → Learn backend</tspan><tspan x="560" dy="29" class="small">message endpoint → /mcp</tspan></text>
  <rect x="870" y="290" width="260" height="155" rx="12" class="external"/>
  <text x="1000" y="329" text-anchor="middle"><tspan x="1000">Microsoft Learn MCP</tspan><tspan x="1000" dy="34" class="small">Public HTTPS endpoint</tspan><tspan x="1000" dy="29" class="small">Anonymous upstream</tspan><tspan x="1000" dy="29" class="small">Actual discovered tools</tspan></text>
  <path d="M270 315H315V265H365" class="flow"/>
  <path d="M560 325V380" class="flow"/>
  <path d="M755 450H815V367H870" class="flow"/>
  <text x="820" y="486" class="small">No Entra token</text>
  <text x="40" y="605" class="small">No REST-operation tool mapping here: Learn owns the tools. This is different from REST-to-MCP.</text>
  <text x="40" y="638" class="small">Private ingress does not make Learn private. Outbound connectivity and protocol compatibility remain required.</text>
</svg>
