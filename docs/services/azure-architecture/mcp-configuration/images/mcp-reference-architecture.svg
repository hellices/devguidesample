<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
  <title id="title">Azure API Management governs access to MCP servers and REST tools</title>
  <desc id="desc">MCP clients send requests to API Management in the center. It validates access, applies policies and routes to an internal MCP server, a partner MCP server, or a REST API exposed as MCP tools. The diagram shows request paths, not a merged tool catalog.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34536f"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;font-size:20px;fill:#162b40}.title{font-size:28px;font-weight:700}.label{font-size:22px;font-weight:700}.small{font-size:18px}.client{fill:#edf5ff;stroke:#2565a4;stroke-width:2}.focus{fill:#fff7e7;stroke:#9c661c;stroke-width:3}.backend{fill:#eef8f1;stroke:#327449;stroke-width:2}.flow{fill:none;stroke:#34536f;stroke-width:2.5;marker-end:url(#arrow)}</style>
  <rect width="1180" height="650" fill="white"/>
  <text x="30" y="44" class="title">1. Azure API Management / AI gateway</text>
  <text x="30" y="78" class="small">A common place to apply policies to internal and partner MCP access</text>
  <rect x="30" y="275" width="245" height="145" rx="12" class="client"/>
  <text x="152" y="320" text-anchor="middle"><tspan x="152" class="label">MCP clients</tspan><tspan x="152" dy="35">IDE / applications</tspan><tspan x="152" dy="31" class="small">Local development</tspan></text>
  <rect x="430" y="190" width="320" height="315" rx="14" class="focus"/>
  <text x="590" y="237" text-anchor="middle"><tspan x="590" class="label">API Management</tspan><tspan x="590" dy="34" class="small">MCP API endpoints</tspan><tspan x="590" dy="50">Entra token validation</tspan><tspan x="590" dy="36">Access / traffic policies</tspan><tspan x="590" dy="36">REST-to-MCP conversion</tspan><tspan x="590" dy="36">Request telemetry</tspan></text>
  <path d="M275 348H430" class="flow"/><text x="290" y="333" class="small">MCP requests</text>
  <rect x="915" y="125" width="235" height="110" rx="12" class="backend"/>
  <text x="1032" y="169" text-anchor="middle"><tspan x="1032" class="label">Internal MCP</tspan><tspan x="1032" dy="33" class="small">Your tools and data</tspan></text>
  <rect x="915" y="293" width="235" height="110" rx="12" class="backend"/>
  <text x="1032" y="337" text-anchor="middle"><tspan x="1032" class="label">Partner MCP</tspan><tspan x="1032" dy="33" class="small">Remote SaaS tools</tspan></text>
  <rect x="915" y="460" width="235" height="110" rx="12" class="backend"/>
  <text x="1032" y="504" text-anchor="middle"><tspan x="1032" class="label">REST API</tspan><tspan x="1032" dy="33" class="small">Existing operations</tspan></text>
  <path d="M750 268H830V180H915" class="flow"/><text x="842" y="164" class="small">MCP</text>
  <path d="M750 348H915" class="flow"/><text x="797" y="332" class="small">MCP</text>
  <path d="M750 427H830V515H915" class="flow"/><text x="842" y="499" class="small">REST</text>
  <text x="30" y="611" class="small">Each MCP API can have its own endpoint. Backend credentials and user delegation are configured per target.</text>
</svg>
