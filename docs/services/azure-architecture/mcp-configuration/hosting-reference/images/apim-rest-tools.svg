<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc">
  <title id="title">APIM native REST API operation exposed as an MCP tool</title>
  <desc id="desc">An Entra-protected native MCP API maps getInventory to an existing APIM REST operation. The operation invokes a private fixture backend and returns a fresh correlated invocation marker. This conversion is not OBO.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34536f"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#162b40;font-size:20px}.title{font-size:28px;font-weight:700}.small{font-size:18px}.box{fill:#edf5ff;stroke:#2565a4;stroke-width:2}.backend{fill:#eef8f1;stroke:#327449;stroke-width:2}.identity{fill:#fff7e7;stroke:#9c661c;stroke-width:2}.flow{fill:none;stroke:#34536f;stroke-width:2.5;marker-end:url(#arrow)}.boundary{fill:#f8fafc;stroke:#8397aa;stroke-width:2;stroke-dasharray:8 6}</style>
  <rect width="1160" height="760" fill="white"/>
  <text x="30" y="45" class="title">APIM native REST-to-MCP: verify the operation, not just the endpoint</text>
  <rect x="330" y="110" width="470" height="570" rx="18" class="boundary"/>
  <text x="350" y="145">Internal APIM Developer gateway</text>
  <rect x="30" y="205" width="245" height="130" rx="12" class="box"/>
  <text x="152" y="246" text-anchor="middle"><tspan x="152">Local MCP client</tspan><tspan x="152" dy="32" class="small">Entra user access token</tspan><tspan x="152" dy="29" class="small">Private route + TLS</tspan></text>
  <rect x="365" y="195" width="395" height="125" rx="12" class="box"/>
  <text x="562" y="232" text-anchor="middle"><tspan x="562">JWT authorization gate</tspan><tspan x="562" dy="31" class="small">Tenant / audience / client / scope</tspan><tspan x="562" dy="28" class="small">Protect initialize, list and call</tspan></text>
  <rect x="870" y="120" width="260" height="125" rx="12" class="identity"/>
  <text x="1000" y="164" text-anchor="middle"><tspan x="1000">Microsoft Entra ID</tspan><tspan x="1000" dy="33" class="small">Registered MCP API</tspan><tspan x="1000" dy="27" class="small">Mcp.Access</tspan></text>
  <rect x="365" y="375" width="395" height="110" rx="12" class="box"/>
  <text x="562" y="414" text-anchor="middle"><tspan x="562">Native MCP API: type = mcp</tspan><tspan x="562" dy="33" class="small">tools/getInventory</tspan></text>
  <rect x="365" y="550" width="395" height="95" rx="12" class="box"/>
  <text x="562" y="587" text-anchor="middle"><tspan x="562">Existing REST operation</tspan><tspan x="562" dy="31" class="small">GET /inventory</tspan></text>
  <rect x="870" y="395" width="260" height="180" rx="12" class="backend"/>
  <text x="1000" y="437" text-anchor="middle"><tspan x="1000">Private REST backend</tspan><tspan x="1000" dy="33" class="small">Fictitious widgets only</tspan><tspan x="1000" dy="29" class="small">Fresh invocation_id</tspan><tspan x="1000" dy="29" class="small">Validated probe_id echo</tspan><tspan x="1000" dy="29" class="small">Rejects any bearer header</tspan></text>
  <path d="M275 265H365" class="flow"/><text x="40" y="372" class="small">POST /rest-tools/mcp</text>
  <path d="M870 182H820V250H760" class="flow"/><text x="807" y="281" class="small">Trust</text>
  <path d="M562 320V375" class="flow"/>
  <path d="M562 485V550" class="flow"/><text x="582" y="523" class="small">operationId mapping</text>
  <path d="M760 600H823V485H870" class="flow"/>
  <text x="827" y="620" class="small">Remove Entra bearer</text>
  <text x="30" y="714" class="small">Proof: REST baseline + real tools/list schema + tools/call + a different, correlated backend invocation.</text>
  <text x="30" y="745" class="small">Native protocol conversion does not create user OBO. Real business backends need their own authorization.</text>
</svg>
