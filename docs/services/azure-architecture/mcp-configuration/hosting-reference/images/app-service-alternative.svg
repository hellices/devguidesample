<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
  <title id="title">App Service private MCP hosting reference alternative</title>
  <desc id="desc">A reference architecture not deployed in this lab. A private endpoint provides inbound access to an App Service MCP app, while VNet integration provides outbound networking. Entra authentication and OBO remain separate application responsibilities.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34536f"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#162b40;font-size:20px}.title{font-size:28px;font-weight:700}.small{font-size:18px}.box{fill:#edf5ff;stroke:#2565a4;stroke-width:2}.identity{fill:#fff7e7;stroke:#9c661c;stroke-width:2}.backend{fill:#eef8f1;stroke:#327449;stroke-width:2}.flow{fill:none;stroke:#34536f;stroke-width:2.5;marker-end:url(#arrow)}.boundary{fill:#f8fafc;stroke:#8397aa;stroke-width:2;stroke-dasharray:8 6}</style>
  <rect width="1160" height="720" fill="white"/>
  <text x="30" y="44" class="title">App Service alternative: separate inbound and outbound networking</text>
  <text x="30" y="82" class="small">Reference design — not deployed in this execution</text>
  <rect x="305" y="165" width="505" height="450" rx="18" class="boundary"/>
  <text x="327" y="200">Private networking boundary</text>
  <rect x="30" y="275" width="225" height="130" rx="12" class="box"/>
  <text x="142" y="319" text-anchor="middle"><tspan x="142">Local client</tspan><tspan x="142" dy="32" class="small">Approved VPN / route</tspan><tspan x="142" dy="28" class="small">Private DNS</tspan></text>
  <rect x="335" y="280" width="190" height="125" rx="12" class="box"/>
  <text x="430" y="323" text-anchor="middle"><tspan x="430">Private endpoint</tspan><tspan x="430" dy="34" class="small">Inbound only</tspan></text>
  <rect x="575" y="245" width="205" height="195" rx="12" class="box"/>
  <text x="677" y="286" text-anchor="middle"><tspan x="677">App Service</tspan><tspan x="677" dy="32">MCP application</tspan><tspan x="677" dy="31" class="small">Easy Auth / JWT</tspan><tspan x="677" dy="29" class="small">Confidential client</tspan><tspan x="677" dy="29" class="small">User OBO</tspan></text>
  <rect x="365" y="500" width="385" height="80" rx="12" class="box"/>
  <text x="557" y="533" text-anchor="middle"><tspan x="557">Regional VNet integration</tspan><tspan x="557" dy="29" class="small">Outbound network path</tspan></text>
  <rect x="875" y="125" width="255" height="110" rx="12" class="identity"/>
  <text x="1002" y="169" text-anchor="middle"><tspan x="1002">Microsoft Entra ID</tspan><tspan x="1002" dy="33" class="small">Authentication / OBO</tspan></text>
  <rect x="875" y="445" width="255" height="130" rx="12" class="backend"/>
  <text x="1002" y="488" text-anchor="middle"><tspan x="1002">Authorized backends</tspan><tspan x="1002" dy="33" class="small">Per-resource tokens</tspan><tspan x="1002" dy="28" class="small">Per-user permissions</tspan></text>
  <path d="M255 342H335" class="flow"/><path d="M525 342H575" class="flow"/>
  <path d="M780 290H825V180H875" class="flow"/>
  <path d="M677 440V500" class="flow"/><path d="M750 540H815V510H875" class="flow"/>
  <text x="35" y="655" class="small">Disable public ingress explicitly. Private deployment also needs the appropriate SCM/Kudu DNS and route.</text>
  <text x="35" y="687" class="small">MCP authorization/PRM preview scope and custom application responsibilities must be checked separately.</text>
</svg>
