# Let's Encrypt certificate for APP_HOST through cert-manager (Helm, config.enableGatewayAPI=true).
# The HTTP-01 solver attaches a temporary HTTPRoute to the Gateway's http listener; the issued key pair is
# stored in the movielog-tls secret that the https listener of 26-agfc.yaml references. cert-manager renews
# it before expiry. The ACME account has no contact email; add spec.acme.email to register one.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: movielog
                namespace: movielog
                kind: Gateway
                sectionName: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: movielog-tls
  namespace: movielog
spec:
  secretName: movielog-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "${APP_HOST}"
