# App secrets from Azure Key Vault through the Secrets Store CSI driver add-on
# (az aks enable-addons --addons azure-keyvault-secrets-provider): TMDB and OMDb keys and the
# Microsoft Entra ID client secret. The driver reads the vault as the app's workload identity (MI_CLIENT_ID needs
# "Key Vault Secrets User" on the vault) when the movielog Pod mounts the volume, then mirrors the values into the
# movielog-keyvault secret that 20-movielog.yaml reads as environment variables. The secret exists only while a
# Pod mounts it.
#   KEYVAULT_NAME, KEYVAULT_TENANT_ID: the vault holding tmdb-api-key, omdb-api-key and entra-client-secret
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: movielog-keyvault
  namespace: movielog
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${MI_CLIENT_ID}"
    keyvaultName: "${KEYVAULT_NAME}"
    tenantId: "${KEYVAULT_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: tmdb-api-key
          objectType: secret
        - |
          objectName: omdb-api-key
          objectType: secret
        - |
          objectName: entra-client-secret
          objectType: secret
  secretObjects:
    - secretName: movielog-keyvault
      type: Opaque
      data:
        - key: tmdb-api-key
          objectName: tmdb-api-key
        - key: omdb-api-key
          objectName: omdb-api-key
        - key: entra-client-secret
          objectName: entra-client-secret
