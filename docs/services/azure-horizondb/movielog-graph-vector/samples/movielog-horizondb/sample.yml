title: MovieLog on Azure HorizonDB with vector search and an Apache AGE graph
description: Spring Boot 4.1 MovieLog app backed by Azure HorizonDB with azd (Bicep and hooks) deployment, a Wikidata and Wikipedia movie catalog loader, Azure OpenAI and bge-m3-ko (vLLM on an AKS GPU spot node) embeddings stored in pgvector with DiskANN indexes, an Apache AGE movie graph with trigger-based sync and a Cytoscape.js view, AKS autoinstrumentation, a load generator, and a Grafana dashboard.
