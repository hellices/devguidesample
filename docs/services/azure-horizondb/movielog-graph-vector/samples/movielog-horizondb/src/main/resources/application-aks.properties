# AKS lab profile: Azure HorizonDB (PostgreSQL 17), no external movie API keys.
# Movies come from the Wikidata catalog loaded into HorizonDB (cache_hit), so the app works without TMDB_API_KEY.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# ag_catalog is appended so Apache AGE cypher() calls resolve; Hibernate keeps using public.
spring.datasource.hikari.connection-init-sql=SET search_path = public, ag_catalog
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/aks-seed.sql

# The Application Insights agent reads the in-process MeterRegistry; no metrics endpoint is exposed.
management.endpoints.web.exposure.include=health

# Allowlist: every exported meter becomes billable customMetrics rows.
management.metrics.enable.all=false
management.metrics.enable.movielog=true

# Public on the internet: every page and API needs a signed-in member (form login or Microsoft Entra ID).
app.security.require-login=true
