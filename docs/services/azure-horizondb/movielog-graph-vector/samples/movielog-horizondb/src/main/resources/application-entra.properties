# Microsoft Entra ID sign-in (OpenID Connect), enabled with the entra profile next to the form login.
# The app registration is single tenant with the web redirect URI https://<host>/login/oauth2/code/entra.
spring.security.oauth2.client.registration.entra.client-name=Microsoft Entra ID
spring.security.oauth2.client.registration.entra.client-id=${ENTRA_CLIENT_ID}
spring.security.oauth2.client.registration.entra.client-secret=${ENTRA_CLIENT_SECRET}
# profile is required for the oid, name and preferred_username claims.
spring.security.oauth2.client.registration.entra.scope=openid,profile
spring.security.oauth2.client.provider.entra.issuer-uri=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
