<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 968" role="img" aria-labelledby="horizondb-app-access-title horizondb-app-access-desc">
  <title id="horizondb-app-access-title">MovieLog app access paths to Azure HorizonDB</title>
  <desc id="horizondb-app-access-desc">Sequence of calls: for semantic search the app embeds the query with Azure OpenAI and runs a pgvector cosine-distance SQL query in HorizonDB; the browser then fetches the relationship graph, which the app reads with an Apache AGE openCypher query; other pages use Spring Data JPA and stored-vector similarity, all over one connection pool to the same database.</desc>
  <defs>
    <marker id="ac-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="ac-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="ac-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
    <style>
      .name { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
      .label { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Segoe UI', sans-serif; font-size: 12px; font-weight: 500; fill: #2d3142; }
      .band { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; fill: #7a8399; }
      .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10px; fill: #4f5d75; }
      .tag { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 8px; letter-spacing: 0.08em; fill: #7a8399; }
      .muted { fill: #4f5d75; }
    </style>
  </defs>

  <rect width="1280" height="968" fill="#f5f5f5"/>

  <!-- Bands (drawn first) -->
  <rect x="24" y="120" width="1232" height="352" rx="6" fill="none" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/>
  <rect x="24" y="120" width="96" height="20" rx="3" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="72" y="134" class="band" text-anchor="middle">① 의미 검색</text>

  <rect x="24" y="488" width="1232" height="256" rx="6" fill="none" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/>
  <rect x="24" y="488" width="96" height="20" rx="3" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="72" y="502" class="band" text-anchor="middle">② 관계 그래프</text>

  <rect x="24" y="760" width="1232" height="144" rx="6" fill="none" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/>
  <rect x="24" y="760" width="96" height="20" rx="3" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="72" y="774" class="band" text-anchor="middle">③ 다른 화면</text>

  <!-- Lifelines -->
  <line x1="160" y1="104" x2="160" y2="904" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="104" x2="480" y2="904" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="820" y1="104" x2="820" y2="904" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="1110" y1="104" x2="1110" y2="904" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Activation bars -->
  <rect x="476" y="172" width="8" height="280" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
  <rect x="816" y="228" width="8" height="48" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
  <rect x="1106" y="340" width="8" height="48" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
  <rect x="476" y="548" width="8" height="176" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
  <rect x="1106" y="612" width="8" height="48" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
  <rect x="476" y="820" width="8" height="72" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
  <rect x="1106" y="820" width="8" height="72" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

  <!-- ① semantic search -->
  <line x1="160" y1="172" x2="474" y2="172" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#ac-arrow-link)"/>
  <rect x="216" y="136" width="208" height="30" rx="2" fill="#f5f5f5"/>
  <text x="320" y="148" class="label" text-anchor="middle">DiscoverWebController</text>
  <text x="320" y="162" class="mono" text-anchor="middle">GET /discover?q=…</text>

  <line x1="484" y1="228" x2="814" y2="228" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#ac-arrow-link)"/>
  <rect x="504" y="192" width="292" height="30" rx="2" fill="#f5f5f5"/>
  <text x="650" y="204" class="label" text-anchor="middle">EmbeddingClient · workload identity 토큰</text>
  <text x="650" y="218" class="mono" text-anchor="middle">POST embeddings · dimensions 1536</text>

  <line x1="816" y1="276" x2="486" y2="276" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ac-arrow)"/>
  <rect x="592" y="254" width="116" height="16" rx="2" fill="#f5f5f5"/>
  <text x="650" y="266" class="mono" text-anchor="middle">float[1536]</text>

  <line x1="484" y1="340" x2="1104" y2="340" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#ac-arrow)"/>
  <rect x="500" y="304" width="300" height="30" rx="2" fill="#f5f5f5"/>
  <text x="650" y="316" class="label" text-anchor="middle">VectorSearchRepository · JdbcClient</text>
  <text x="650" y="330" class="mono" text-anchor="middle">movie_docs ⋈ movies: &lt;=&gt; :v 순위 + 키워드 순위(RRF)</text>

  <line x1="1106" y1="388" x2="486" y2="388" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ac-arrow)"/>
  <rect x="560" y="366" width="180" height="16" rx="2" fill="#f5f5f5"/>
  <text x="650" y="378" class="label" text-anchor="middle">영화 12편 + 코사인 유사도</text>

  <line x1="476" y1="452" x2="162" y2="452" stroke="#eb6c36" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ac-arrow-accent)"/>
  <rect x="216" y="416" width="208" height="30" rx="2" fill="#f5f5f5"/>
  <text x="320" y="428" class="label" text-anchor="middle">HTML 결과 목록 + 그래프 URL</text>
  <text x="320" y="442" class="mono" text-anchor="middle">graph?ids=&lt;12 tmdb_id&gt;</text>

  <!-- ② relationship graph -->
  <line x1="160" y1="548" x2="474" y2="548" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#ac-arrow-link)"/>
  <rect x="200" y="512" width="240" height="30" rx="2" fill="#f5f5f5"/>
  <text x="320" y="524" class="label" text-anchor="middle">graph.js fetch</text>
  <text x="320" y="538" class="mono" text-anchor="middle">GET /api/discover/graph?ids=…</text>

  <line x1="484" y1="612" x2="1104" y2="612" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#ac-arrow)"/>
  <rect x="496" y="576" width="308" height="30" rx="2" fill="#f5f5f5"/>
  <text x="650" y="588" class="label" text-anchor="middle">MovieGraphRepository · JdbcTemplate</text>
  <text x="650" y="602" class="mono" text-anchor="middle">cypher: UNWIND ids MATCH (a:Movie {tmdb_id})-[r]-(b)</text>

  <line x1="1106" y1="660" x2="486" y2="660" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ac-arrow)"/>
  <rect x="560" y="638" width="180" height="16" rx="2" fill="#f5f5f5"/>
  <text x="650" y="650" class="label" text-anchor="middle">vertex · edge 행 (agtype)</text>

  <line x1="476" y1="724" x2="162" y2="724" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ac-arrow)"/>
  <rect x="216" y="688" width="208" height="30" rx="2" fill="#f5f5f5"/>
  <text x="320" y="700" class="label" text-anchor="middle">JSON nodes · edges</text>
  <text x="320" y="714" class="mono" text-anchor="middle">Cytoscape.js fCoSE layout</text>

  <!-- ③ other pages -->
  <line x1="484" y1="836" x2="1104" y2="836" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#ac-arrow)"/>
  <rect x="512" y="800" width="276" height="30" rx="2" fill="#f5f5f5"/>
  <text x="650" y="812" class="label" text-anchor="middle">리뷰·회원·영화 — Spring Data JPA</text>
  <text x="650" y="826" class="mono" text-anchor="middle">Hibernate SQL on public.*</text>

  <line x1="484" y1="884" x2="1104" y2="884" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#ac-arrow)"/>
  <rect x="504" y="848" width="292" height="30" rx="2" fill="#f5f5f5"/>
  <text x="650" y="860" class="label" text-anchor="middle">상세 화면 비슷한 영화 — 임베딩 호출 없음</text>
  <text x="650" y="874" class="mono" text-anchor="middle">embedding &lt;=&gt; 저장된 영화 벡터 LIMIT 6</text>

  <!-- Actors (on top) -->
  <rect x="52" y="20" width="216" height="84" rx="6" fill="#f5f5f5"/>
  <rect x="52" y="20" width="216" height="84" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="64" y="36" class="tag">USER</text>
  <text x="160" y="62" class="name" text-anchor="middle">브라우저</text>
  <text x="160" y="82" class="mono" text-anchor="middle">Cytoscape.js · fCoSE</text>

  <rect x="372" y="20" width="216" height="84" rx="6" fill="#f5f5f5"/>
  <rect x="372" y="20" width="216" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="384" y="36" class="tag">AKS POD ×2 · VIA AGFC</text>
  <text x="480" y="62" class="name" text-anchor="middle">MovieLog 앱</text>
  <text x="480" y="82" class="mono" text-anchor="middle">DiscoverService · Timer</text>

  <rect x="712" y="20" width="216" height="84" rx="6" fill="#f5f5f5"/>
  <rect x="712" y="20" width="216" height="84" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="724" y="36" class="tag">AI</text>
  <text x="820" y="62" class="name" text-anchor="middle">Azure OpenAI</text>
  <text x="820" y="82" class="mono" text-anchor="middle">text-embedding-3-large</text>

  <rect x="978" y="20" width="264" height="84" rx="6" fill="#f5f5f5"/>
  <rect x="978" y="20" width="264" height="84" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="990" y="36" class="tag" style="fill:#eb6c36">DB</text>
  <text x="1110" y="56" class="name" text-anchor="middle">Azure HorizonDB</text>
  <text x="1110" y="76" class="mono" text-anchor="middle">user movielog · HikariCP 10</text>
  <text x="1110" y="92" class="mono" text-anchor="middle">search_path public, ag_catalog</text>

  <!-- Legend -->
  <line x1="24" y1="924" x2="1256" y2="924" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="24" y="952" class="tag" style="fill:#4f5d75">LEGEND</text>
  <line x1="96" y1="948" x2="132" y2="948" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#ac-arrow-link)"/>
  <text x="140" y="952" class="label muted">HTTP·HTTPS 호출</text>
  <line x1="264" y1="948" x2="300" y2="948" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#ac-arrow)"/>
  <text x="308" y="952" class="label muted">SQL·Cypher 호출 (같은 커넥션 풀)</text>
  <line x1="516" y1="948" x2="552" y2="948" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ac-arrow)"/>
  <text x="560" y="952" class="label muted">응답</text>
  <line x1="612" y1="948" x2="648" y2="948" stroke="#eb6c36" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ac-arrow-accent)"/>
  <text x="656" y="952" class="label muted">사용자가 보는 의미 검색 결과</text>
  <rect x="856" y="941" width="10" height="14" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="874" y="952" class="label muted">처리 중(activation)</text>
</svg>
