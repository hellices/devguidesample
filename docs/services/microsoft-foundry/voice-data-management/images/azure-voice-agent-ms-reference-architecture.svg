  <text x="540" y="169" text-anchor="middle" class="label">전사</text>
  <rect x="773" y="157" width="54" height="16" rx="2" fill="#ffffff"/>
  <text x="800" y="169" text-anchor="middle" class="label">마스킹</text>
  <rect x="1038" y="284" width="54" height="16" rx="2" fill="#ffffff"/>
  <text x="1065" y="296" text-anchor="middle" class="label">분석</text>
  <rect x="773" y="427" width="54" height="16" rx="2" fill="#ffffff"/>
  <text x="800" y="439" text-anchor="middle" class="label">선택 처리</text>

  <!-- Input -->
  <rect x="60" y="270" width="200" height="110" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="80" y="294" class="tag" fill="#9a3412">INPUT · TRIGGER</text>
  <text x="160" y="322" text-anchor="middle" class="node">녹음 오디오 · Blob</text>
