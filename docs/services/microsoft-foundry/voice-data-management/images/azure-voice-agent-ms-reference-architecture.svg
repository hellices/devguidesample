  <text x="600" y="176" text-anchor="middle" class="node">Voice Live · GPT Realtime</text>
  <text x="600" y="198" text-anchor="middle" class="body">실시간 음성 입출력 · 모델 · 도구</text>
  <text x="600" y="216" text-anchor="middle" class="small">Voice Live API 자체 기본 미보관 [2]</text>

