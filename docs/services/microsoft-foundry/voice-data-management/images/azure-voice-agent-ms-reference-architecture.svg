<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="azure-ms-voice-arch-title azure-ms-voice-arch-desc">
  <title id="azure-ms-voice-arch-title">Microsoft 통화 후 분석 참조 아키텍처의 처리·저장 흐름</title>
  <desc id="azure-ms-voice-arch-desc">통화 녹음이 Blob Storage에 저장된 뒤 Speech 배치 전사, Conversation PII, Foundry 모델 분석으로 이어지는 경로와 Content Understanding, 애플리케이션 PII 처리로 이어지는 경로를 분리합니다. 두 경로의 결과는 Azure Storage에서 Power BI, 웹 앱과 CRM으로 전달됩니다.</desc>
  <defs>
    <marker id="azure-ms-voice-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="azure-ms-voice-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <marker id="azure-ms-voice-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <style>
      text{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#0f172a}
      .title{font-size:28px;font-weight:700}
      .subtitle{font-size:13px;fill:#475569}
      .source{font-size:11px;fill:#64748b}
      .zone-label{font-size:12px;font-weight:700;fill:#475569;letter-spacing:.04em}
      .node{font-size:16px;font-weight:700}
      .body{font-size:13px;fill:#334155}
      .small{font-size:12px;fill:#64748b}
      .tag{font-size:10px;font-weight:700;letter-spacing:.06em}
      .label{font-size:11px;font-weight:700;fill:#475569}
      .legend{font-size:11px;fill:#64748b}
    </style>
  </defs>

  <rect width="1280" height="660" fill="#ffffff"/>
  <text x="40" y="44" class="title">통화 후 저장 · 전사 · 분석 흐름</text>
  <text x="40" y="70" class="subtitle">통화가 끝난 뒤 실행하는 두 Microsoft 참조 경로를 분리</text>
  <text x="1240" y="70" text-anchor="end" class="source">Microsoft 공식 참조를 작성자가 재도식화 · 공식 원본 링크는 본문 제공</text>

  <!-- Zones -->
  <rect x="40" y="100" width="1200" height="500" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="52" y="108" width="264" height="22" rx="3" fill="#ffffff"/>
  <text x="64" y="124" class="zone-label">MICROSOFT REFERENCE · POST-CALL</text>
  <rect x="300" y="116" width="506" height="22" rx="3" fill="#ffffff"/>
