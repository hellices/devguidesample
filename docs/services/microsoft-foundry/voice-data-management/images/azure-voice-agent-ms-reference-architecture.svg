  <rect x="320" y="470" width="180" height="80" rx="8" fill="#ffffff" stroke="#0284c7" stroke-dasharray="5,4"/>
  <text x="340" y="492" class="tag" fill="#075985">OPTIONAL STORE</text>
  <text x="410" y="522" text-anchor="middle" class="node">원문 음성 텍스트</text>
  <text x="410" y="542" text-anchor="middle" class="small">Blob Storage</text>

  <rect x="580" y="328" width="220" height="96" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="600" y="350" class="tag" fill="#166534">REDACT · ANALYZE</text>
  <text x="690" y="378" text-anchor="middle" class="node">Language PII → Foundry</text>
  <text x="690" y="402" text-anchor="middle" class="small">민감정보 제거 · 의도 · 감정 · 요약</text>

  <rect x="580" y="480" width="220" height="96" rx="8" fill="#ffffff" stroke="#0284c7"/>
  <text x="600" y="502" class="tag" fill="#075985">TRANSCRIBE · ANALYZE</text>
  <text x="690" y="530" text-anchor="middle" class="node">Content Understanding</text>
  <text x="690" y="554" text-anchor="middle" class="small">음성 텍스트 · 요약 · 감정 · 개체</text>

  <rect x="840" y="480" width="160" height="96" rx="8" fill="#ffffff" stroke="#64748b"/>
