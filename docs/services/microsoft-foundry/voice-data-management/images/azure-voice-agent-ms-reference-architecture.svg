  <path d="M600 224 V258 Q600 266 592 266 H220 Q212 266 212 274 V338" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#azure-ms-voice-arrow-link)"/>

