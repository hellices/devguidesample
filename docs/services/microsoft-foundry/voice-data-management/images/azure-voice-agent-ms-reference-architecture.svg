<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="azure-ms-voice-arch-title azure-ms-voice-arch-desc">
  <title id="azure-ms-voice-arch-title">Azure 음성 에이전트의 실시간 처리와 Microsoft 참조 저장 흐름</title>
  <desc id="azure-ms-voice-arch-desc">Voice Live와 GPT Realtime의 실시간 음성 처리 흐름을 위쪽에, Azure Architecture Center가 제시한 원음 저장, 트리거, 음성 인식과 분석, 처리 결과 저장, Power BI와 CRM 활용 흐름을 아래쪽에 구분해 보여 줍니다. 두 공식 문서의 범위를 병치한 그림이며 Microsoft가 제공한 단일 참조 아키텍처는 아닙니다.</desc>
  <defs>
    <marker id="azure-ms-voice-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="azure-ms-voice-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <marker id="azure-ms-voice-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <style>
      text{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#0f172a}
      .title{font-size:28px;font-weight:700}
      .subtitle{font-size:13px;fill:#475569}
      .zone-label{font-size:12px;font-weight:700;fill:#475569}
      .tag{font-size:10px;font-weight:700;letter-spacing:.04em}
      .node{font-size:16px;font-weight:700}
      .body{font-size:13px;fill:#334155}
      .small{font-size:12px;fill:#64748b}
      .label{font-size:11px;font-weight:700;fill:#475569}
      .source{font-size:11px;fill:#64748b}
    </style>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="40" y="44" class="title">Azure 음성 에이전트 · 실시간 처리와 Microsoft 참조 저장 흐름</text>
  <text x="40" y="70" class="subtitle">제품 기본 동작과 Azure Architecture Center의 저장·분석 흐름을 분리해 표시</text>
  <text x="1240" y="70" text-anchor="end" class="source">공식 문서 범위 병치 · 단일 Microsoft 제공 SVG 아님</text>

  <!-- Zones -->
  <rect x="40" y="96" width="1200" height="204" rx="8" fill="#eff6ff" fill-opacity=".62" stroke="#93c5fd"/>
  <rect x="52" y="104" width="184" height="22" rx="3" fill="#ffffff"/>
  <text x="64" y="120" class="zone-label">제품 동작 · 실시간 처리 [2]</text>

  <rect x="40" y="336" width="1200" height="278" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="52" y="344" width="280" height="22" rx="3" fill="#ffffff"/>
  <text x="64" y="360" class="zone-label">MICROSOFT REFERENCE [1] · 저장·분석</text>

  <!-- Primary realtime flow -->
  <path d="M244 198 H300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#azure-ms-voice-arrow)"/>
  <path d="M520 198 H576" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#azure-ms-voice-arrow)"/>
  <path d="M796 198 H852" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#azure-ms-voice-arrow)"/>

  <!-- Microsoft reference storage and analytics flow -->
  <path d="M292 480 H340" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#azure-ms-voice-arrow)"/>
  <path d="M508 480 H556" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#azure-ms-voice-arrow)"/>
  <path d="M784 480 H832" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#azure-ms-voice-arrow)"/>
  <path d="M1032 480 H1080" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#azure-ms-voice-arrow)"/>

  <!-- Cross-zone writes -->
  <path d="M132 248 V414" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#azure-ms-voice-arrow)"/>
  <path d="M410 260 V382 Q410 390 402 390 H232 Q224 390 224 398 V414"
        fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#azure-ms-voice-arrow-link)"/>

  <!-- Connector labels -->
  <rect x="144" y="304" width="90" height="18" rx="2" fill="#ffffff"/>
  <text x="150" y="317" class="label">녹음 파일 [1]</text>
  <rect x="260" y="366" width="132" height="18" rx="2" fill="#ffffff"/>
  <text x="326" y="379" text-anchor="middle" class="label" fill="#0284c7">분석용 저장 대안 [1]</text>

  <!-- Realtime nodes -->
  <rect x="64" y="148" width="180" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="84" y="170" class="tag" fill="#475569">CHANNEL</text>
  <text x="154" y="204" text-anchor="middle" class="node">단말 · 전화 서버</text>
  <text x="154" y="228" text-anchor="middle" class="small">사용자 음성 · 통화 녹음</text>

  <rect x="300" y="136" width="220" height="124" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="320" y="160" class="tag" fill="#075985">REALTIME</text>
  <text x="410" y="194" text-anchor="middle" class="node">Voice Live · GPT Realtime</text>
  <text x="410" y="220" text-anchor="middle" class="body">실시간 음성 송수신</text>
  <text x="410" y="242" text-anchor="middle" class="small">Voice Live 자체 보관 없음 [2]</text>

  <rect x="576" y="148" width="220" height="100" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="596" y="170" class="tag" fill="#166534">AI</text>
  <text x="686" y="204" text-anchor="middle" class="node">Foundry 모델 · 도구</text>
  <text x="686" y="228" text-anchor="middle" class="small">추론 · 함수 호출</text>

  <rect x="852" y="148" width="180" height="100" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="872" y="170" class="tag" fill="#166534">OUTPUT</text>
  <text x="942" y="204" text-anchor="middle" class="node">응답 음성</text>
  <text x="942" y="228" text-anchor="middle" class="small">실시간 반환</text>

  <!-- Reference architecture nodes -->
  <rect x="64" y="414" width="228" height="120" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="84" y="438" class="tag" fill="#9a3412">AZURE BLOB STORAGE</text>
  <text x="178" y="470" text-anchor="middle" class="node">원음 · 선택적 원문</text>
  <text x="178" y="496" text-anchor="middle" class="body">녹음 오디오</text>
  <text x="178" y="518" text-anchor="middle" class="small">원문 음성 텍스트(선택) [1]</text>

  <rect x="340" y="432" width="168" height="96" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="360" y="454" class="tag" fill="#475569">TRIGGER</text>
  <text x="424" y="484" text-anchor="middle" class="node">Azure Functions</text>
  <text x="424" y="508" text-anchor="middle" class="small">Blob · Timer trigger</text>

  <rect x="556" y="414" width="228" height="120" rx="8" fill="#ffffff" stroke="#0284c7"/>
  <text x="576" y="438" class="tag" fill="#075985">ANALYZE</text>
  <text x="670" y="468" text-anchor="middle" class="node">Speech · Content Understanding</text>
  <text x="670" y="494" text-anchor="middle" class="body">음성 텍스트 · PII 제거</text>
  <text x="670" y="516" text-anchor="middle" class="small">요약 · 감정 · 개체</text>

  <rect x="832" y="414" width="200" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="852" y="438" class="tag" fill="#166534">AZURE STORAGE</text>
  <text x="932" y="474" text-anchor="middle" class="node">처리 결과</text>
  <text x="932" y="500" text-anchor="middle" class="body">분석 산출물 [1]</text>

  <rect x="1080" y="432" width="144" height="96" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="1100" y="454" class="tag" fill="#475569">CONSUME</text>
  <text x="1152" y="484" text-anchor="middle" class="node">Power BI · CRM</text>
  <text x="1152" y="508" text-anchor="middle" class="small">시각화 · 통화 이력</text>

  <!-- Legend and sources -->
  <line x1="40" y1="640" x2="1240" y2="640" stroke="#e2e8f0"/>
  <line x1="64" y1="666" x2="96" y2="666" stroke="#475569" stroke-width="2" marker-end="url(#azure-ms-voice-arrow)"/>
  <text x="108" y="670" class="small">Microsoft 참조 주 흐름 [1]</text>
  <line x1="324" y1="666" x2="356" y2="666" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#azure-ms-voice-arrow-link)"/>
  <text x="368" y="670" class="small">가상 에이전트 분석용 저장 대안 [1]</text>
  <rect x="668" y="656" width="28" height="18" rx="4" fill="#fff7ed" stroke="#ea580c"/>
  <text x="708" y="670" class="small">저장소</text>
  <text x="1240" y="670" text-anchor="end" class="source">[1] Azure Architecture Center · [2] Voice Live data privacy</text>
  <text x="40" y="704" class="source">[1] call-center-openai-analytics · [2] voice-live/data-privacy-security</text>
</svg>
