  <text x="850" y="434" class="tag" fill="#475569">APP STEP</text>
  <text x="920" y="462" text-anchor="middle" class="node">애플리케이션 PII</text>
  <text x="920" y="486" text-anchor="middle" class="small">필요한 경우 별도 처리</text>

  <!-- Results and consumers -->
  <rect x="1050" y="270" width="180" height="100" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
