<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-labelledby="azure-ms-voice-arch-title azure-ms-voice-arch-desc">
  <title id="azure-ms-voice-arch-title">Azure 음성 에이전트의 실시간 처리와 Microsoft 참조 저장 흐름</title>
  <desc id="azure-ms-voice-arch-desc">Voice Live와 GPT Realtime의 실시간 음성 처리를 위쪽에, 통화 후 저장·분석을 아래쪽에 표시합니다. 아래쪽은 녹음 오디오에서 Azure Speech로 음성 텍스트를 만든 뒤 선택적으로 원문을 저장하고 Language에서 개인정보를 제거한 후 Foundry 모델로 분석하는 경로와, Content Understanding이 음성 텍스트와 분석 결과를 만든 뒤 필요한 경우 애플리케이션이 개인정보를 제거하는 경로를 분리합니다. 두 경로의 처리 결과는 Azure Storage를 거쳐 Power BI, 웹 앱 또는 CRM으로 전달됩니다.</desc>
  <defs>
    <marker id="azure-ms-voice-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="azure-ms-voice-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <style>
      text{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#0f172a}
      .title{font-size:28px;font-weight:700}
      .subtitle{font-size:13px;fill:#475569}
      .zone-label{font-size:12px;font-weight:700;fill:#475569}
      .lane{font-size:11px;font-weight:700;fill:#64748b}
      .tag{font-size:10px;font-weight:700;letter-spacing:.04em}
      .node{font-size:16px;font-weight:700}
      .body{font-size:13px;fill:#334155}
      .small{font-size:12px;fill:#64748b}
      .label{font-size:11px;font-weight:700;fill:#475569}
      .source{font-size:11px;fill:#64748b}
    </style>
  </defs>

  <rect width="1280" height="740" fill="#ffffff"/>
  <text x="40" y="44" class="title">Azure 음성 에이전트 · 실시간 처리와 Microsoft 참조 저장 흐름</text>
  <text x="40" y="70" class="subtitle">제품 기본 동작과 통화 후 두 분석 경로를 분리해 표시</text>
  <text x="1240" y="70" text-anchor="end" class="source">공식 문서 범위 병치 · 단일 Microsoft 제공 SVG 아님</text>

  <!-- Zones -->
  <rect x="40" y="96" width="1200" height="152" rx="8" fill="#eff6ff" fill-opacity=".62" stroke="#93c5fd"/>
  <rect x="52" y="104" width="184" height="22" rx="3" fill="#ffffff"/>
  <text x="64" y="120" class="zone-label">제품 동작 · 실시간 처리 [2]</text>

  <rect x="40" y="284" width="1200" height="374" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="52" y="292" width="306" height="22" rx="3" fill="#ffffff"/>
  <text x="64" y="308" class="zone-label">MICROSOFT REFERENCE [1] · 통화 후 저장·분석</text>

