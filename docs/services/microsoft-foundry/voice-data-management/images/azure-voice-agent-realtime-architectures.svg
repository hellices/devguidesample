  <text x="275" y="538" text-anchor="middle" class="label">음성</text>
  <text x="485" y="538" text-anchor="middle" class="label">텍스트</text>
  <text x="785" y="538" text-anchor="middle" class="label">응답문</text>
  <text x="1005" y="538" text-anchor="middle" class="label">오디오</text>
  <text x="550" y="619" class="label">호출</text>
  <text x="704" y="619" class="label">결과</text>
  <text x="125" y="728" class="label">원음</text>
  <text x="350" y="728" class="label">STT 결과</text>
  <text x="650" y="728" class="label">도구 이벤트</text>
  <text x="797" y="728" class="label">모델 응답</text>
  <text x="905" y="728" class="label">출력 오디오</text>

  <!-- Native realtime nodes -->
  <rect id="native-input" x="80" y="155" width="200" height="82" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="100" y="177" class="tag" fill="#475569">CHANNEL</text>
  <text x="180" y="203" text-anchor="middle" class="node">단말 · 전화</text>
  <text x="180" y="223" text-anchor="middle" class="small">오디오 입출력 종단</text>

  <rect id="native-model" x="430" y="145" width="280" height="102" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
  <text x="450" y="169" class="tag" fill="#075985">NATIVE AUDIO MODEL</text>
  <text x="570" y="197" text-anchor="middle" class="node">Realtime 음성 모델</text>
  <text x="570" y="221" text-anchor="middle" class="body">오디오 직접 처리 · 음성 응답</text>

