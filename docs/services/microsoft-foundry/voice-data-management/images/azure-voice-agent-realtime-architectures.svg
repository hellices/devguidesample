  <text x="540" y="190" text-anchor="middle" class="node">Realtime 음성 모델</text>
  <text x="540" y="214" text-anchor="middle" class="body">오디오 직접 처리 · 음성 응답</text>

  <rect x="840" y="148" width="260" height="82" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="860" y="170" class="tag" fill="#166534">BUSINESS</text>
  <text x="970" y="196" text-anchor="middle" class="node">도구 · 업무 시스템</text>
  <text x="970" y="216" text-anchor="middle" class="small">주문 · 기기 동작 · 지원 티켓</text>

  <rect x="400" y="248" width="700" height="38" rx="6" fill="#ffffff" stroke="#0284c7" stroke-dasharray="5,4"/>
  <text x="750" y="264" text-anchor="middle" class="small">선택 기록 · 선택 전사 · 추적 로그 · 사후 분석 사본</text>
  <text x="750" y="281" text-anchor="middle" class="small">Foundry voice agent store(해당 시) · 직접 Realtime API 공통 설정 아님</text>

