  <rect x="70" y="364" width="180" height="78" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="90" y="386" class="tag" fill="#475569">CHANNEL</text>
  <text x="160" y="412" text-anchor="middle" class="node">단말 · 전화</text>
  <text x="160" y="432" text-anchor="middle" class="small">입력 오디오</text>

