  <path id="pipeline-stt-to-records" d="M335 594 V750" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#azure-realtime-arrow-link)"/>
  <path id="pipeline-model-to-records" d="M760 575 H785 V750" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#azure-realtime-arrow-link)"/>
  <path id="pipeline-tools-to-records" d="M635 690 V750" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#azure-realtime-arrow-link)"/>
  <path id="pipeline-tts-to-records" d="M890 594 V750" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#azure-realtime-arrow-link)"/>

