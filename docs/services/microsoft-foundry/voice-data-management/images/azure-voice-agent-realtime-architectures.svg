  <rect x="719" y="228" width="82" height="16" rx="2" fill="#ffffff"/>
  <text x="760" y="240" text-anchor="middle" class="label">업무 결과</text>

  <rect x="253" y="374" width="54" height="16" rx="2" fill="#ffffff"/>
