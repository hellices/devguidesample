  <rect x="453" y="374" width="54" height="16" rx="2" fill="#ffffff"/>
  <text x="480" y="386" text-anchor="middle" class="label">텍스트</text>
  <rect x="733" y="374" width="54" height="16" rx="2" fill="#ffffff"/>
