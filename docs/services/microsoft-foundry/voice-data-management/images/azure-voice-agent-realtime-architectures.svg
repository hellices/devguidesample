<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="azure-realtime-architectures-title azure-realtime-architectures-desc">
  <title id="azure-realtime-architectures-title">Azure 음성 에이전트의 네이티브 Realtime과 분리형 파이프라인</title>
  <desc id="azure-realtime-architectures-desc">위쪽은 입력 오디오가 Realtime 모델로 직접 들어가고 같은 입력 오디오를 별도 전사 모델로 보낼 수 있는 경로입니다. 입력 전사는 모델 내부 텍스트 추출이 아닙니다. 아래쪽은 STT, 텍스트 모델, 도구, TTS를 구분합니다. 두 구조 모두 각 단계에서 노출한 원음, 전사, 응답과 도구 이벤트를 공통 선택 기록 영역으로 연결하지만 앱 녹음, Foundry voice agent store, 추적은 별도 설정입니다. 분석과 사본은 구현에 따라 세션 중 또는 종료 후 생성됩니다.</desc>
  <defs>
    <marker id="azure-realtime-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="azure-realtime-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <style>
      text{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#0f172a}
      .title{font-size:28px;font-weight:700}
      .subtitle{font-size:13px;fill:#475569}
      .source{font-size:12px;fill:#64748b}
      .zone-label{font-size:12px;font-weight:700;fill:#475569;letter-spacing:.04em}
      .node{font-size:16px;font-weight:700}
      .body{font-size:13px;fill:#334155}
      .small{font-size:12px;fill:#64748b}
      .tag{font-size:12px;font-weight:700;letter-spacing:.04em}
      .label{font-size:12px;font-weight:700;fill:#475569}
      .legend{font-size:12px;fill:#64748b}
    </style>
  </defs>

  <rect width="1280" height="920" fill="#ffffff"/>
  <text x="40" y="44" class="title">실시간 음성 처리 구조 비교</text>
  <text x="40" y="70" class="subtitle">네이티브 Realtime과 STT → 텍스트 모델·에이전트 → TTS 경로를 분리</text>
  <text x="1240" y="70" text-anchor="end" class="source">공식 문서를 기반으로 한 종합 구성 예시</text>

  <!-- Zones -->
  <rect x="40" y="100" width="1200" height="346" rx="8" fill="#eff6ff" fill-opacity=".58" stroke="#93c5fd"/>
  <rect x="52" y="108" width="520" height="22" rx="3" fill="#ffffff"/>
  <text x="64" y="124" class="zone-label">네이티브 REALTIME · 직접 API 또는 Voice Live + Realtime 모델</text>

  <rect x="40" y="466" width="1200" height="350" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="52" y="474" width="668" height="22" rx="3" fill="#ffffff"/>
  <text x="64" y="490" class="zone-label">분리형 PIPELINE · Voice Live + 텍스트 입출력 모델 또는 애플리케이션 조합</text>

