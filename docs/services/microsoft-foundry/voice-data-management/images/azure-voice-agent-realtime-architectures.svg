  <text x="620" y="510" text-anchor="middle" class="node">도구 · 업무 시스템</text>

  <rect x="790" y="472" width="410" height="52" rx="6" fill="#ffffff" stroke="#0284c7" stroke-dasharray="5,4"/>
  <text x="995" y="493" text-anchor="middle" class="small">선택 기록 · 단계별 로그 · 오디오 사본</text>
  <text x="995" y="513" text-anchor="middle" class="small">Foundry voice agent store(해당 시) · 추적·사후 분석은 별도 정책</text>

  <!-- Legend -->
