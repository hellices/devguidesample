  <text x="635" y="558" text-anchor="middle" class="node">텍스트 모델 · 에이전트</text>
  <text x="635" y="582" text-anchor="middle" class="small">텍스트 입력 · 도구 판단</text>

  <rect id="pipeline-tts" x="810" y="516" width="160" height="78" rx="8" fill="#ffffff" stroke="#0284c7"/>
  <text x="830" y="538" class="tag" fill="#075985">TTS</text>
  <text x="890" y="564" text-anchor="middle" class="node">음성 합성</text>
  <text x="890" y="584" text-anchor="middle" class="small">출력 오디오</text>

  <rect x="1040" y="516" width="170" height="78" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="1060" y="538" class="tag" fill="#475569">CHANNEL</text>
  <text x="1125" y="564" text-anchor="middle" class="node">응답 재생</text>
  <text x="1125" y="584" text-anchor="middle" class="small">단말 · 전화</text>

  <rect id="pipeline-tools" x="510" y="632" width="250" height="58" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
