  <text x="1040" y="223" text-anchor="middle" class="small">호출 결과와 저장 이력은 구분</text>

  <rect id="native-transcription" x="340" y="282" width="300" height="68" rx="8" fill="#ffffff" stroke="#0284c7" stroke-dasharray="5,4"/>
  <text x="358" y="301" class="tag" fill="#075985">OPTIONAL INPUT TRANSCRIPTION</text>
  <text x="490" y="323" text-anchor="middle" class="node">별도 입력 전사 모델</text>
  <text x="490" y="342" text-anchor="middle" class="small">모델 내부 텍스트 추출 아님</text>

  <rect id="native-records" x="80" y="380" width="1090" height="50" rx="6" fill="#ffffff" stroke="#0284c7" stroke-dasharray="5,4"/>
  <text x="625" y="400" text-anchor="middle" class="body">공통 선택 기록 · 원음 · 입력 전사 · 모델 응답 · 도구 이벤트</text>
  <text x="625" y="421" text-anchor="middle" class="small">앱 녹음 · Foundry voice agent store · tracing은 각각 별도 설정</text>

  <!-- Cascaded nodes -->
  <rect id="pipeline-input" x="80" y="516" width="170" height="78" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
