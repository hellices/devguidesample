  <text x="635" y="678" text-anchor="middle" class="node">도구 · 업무 시스템</text>

  <rect id="pipeline-records" x="80" y="750" width="1130" height="50" rx="6" fill="#ffffff" stroke="#0284c7" stroke-dasharray="5,4"/>
  <text x="645" y="770" text-anchor="middle" class="body">공통 선택 기록 · 원음 · STT 전사 · 모델 응답 · 도구 이벤트 · TTS 출력</text>
  <text x="645" y="791" text-anchor="middle" class="small">단계별로 노출된 데이터만 수집 · 앱 녹음·store·추적의 보유·삭제는 별도 정책</text>

  <text x="40" y="842" class="small">점선은 선택 전사·저장·관측 경로입니다. 서비스/API가 노출한 데이터만 수집하며 관리형 내부 단계 접근을 보장하지 않습니다.</text>
  <text x="40" y="864" class="small">요약·분석·사본은 구현에 따라 세션 중 또는 종료 후 생성·저장됩니다. 공통 기록 영역은 단일 저장 스위치나 기본 녹음을 뜻하지 않습니다.</text>

