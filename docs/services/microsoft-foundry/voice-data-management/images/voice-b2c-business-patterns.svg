<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="voice-b2c-title voice-b2c-desc">
  <title id="voice-b2c-title">소비자 대상 음성 업무 사례의 저장 위치와 보유기간</title>
  <desc id="voice-b2c-desc">구매·주문의 Alexa Shopping은 Amazon cloud와 Alexa 계정에 원음·음성 텍스트를 두고 3개월·18개월 자동 삭제나 미저장을 선택합니다. 제품 제어·진단에서 Bixby의 요청 처리 후 삭제 또는 동의 시 총 1년은 미국 정책 범위이고, LG의 즉시 폐기는 미국 Smart TV에서 호출어가 감지되지 않은 오디오에 적용되며 활성 세션 명령 원음의 고정 보유기간은 공개되지 않았습니다. Dyson은 Alexa 계정 설정을 따릅니다. 제품 지원은 Be My Eyes 기본 녹화 없음과 고객사 요청 녹화를 구분하고 Microsoft 실제 설정과 Samsung·LG 원음 기간은 공개되지 않았습니다. 보험 청구·상담은 저장 위치와 원음 기간이 공개되지 않았고 AXA 보험·청구 기록은 최대 10년이며, 상담 분석·판매 확인 사례는 저장 위치와 보유기간이 공개되지 않았습니다.</desc>
