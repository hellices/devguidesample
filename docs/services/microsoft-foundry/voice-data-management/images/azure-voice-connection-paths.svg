  <text x="190" y="624" text-anchor="middle" class="node">전화 · SIP 트렁크</text>
  <text x="190" y="644" text-anchor="middle" class="small">통신사·PBX에서 SIP로 연결</text>

  <rect x="520" y="646" width="240" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="540" y="666" class="tag" fill="#475569">APP SERVER</text>
  <text x="640" y="692" text-anchor="middle" class="node">webhook 서버</text>
  <text x="640" y="708" text-anchor="middle" class="small">통화 수락·거절·세션 설정</text>

  <rect x="960" y="576" width="240" height="140" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
  <text x="980" y="598" class="tag" fill="#075985">AZURE</text>
  <text x="1080" y="624" text-anchor="middle" class="node">Realtime API (SIP)</text>
  <text x="1080" y="644" text-anchor="middle" class="small">East US 2 · Sweden Central</text>

  <path d="M302 606 H958" fill="none" stroke="#334155" stroke-width="2.6" marker-start="url(#vc-arrow-start)" marker-end="url(#vc-arrow)"/>
  <text x="630" y="598" text-anchor="middle" class="label">음성(SIP 통화)</text>
  <path d="M960 664 H762" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#vc-link)"/>
  <text x="860" y="656" text-anchor="middle" class="link-label">① 수신 이벤트(webhook)</text>
  <path d="M760 700 H958" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#vc-link)"/>
  <text x="860" y="692" text-anchor="middle" class="link-label">② 수락 API · WebSocket(이벤트·명령)</text>

  <text x="80" y="738" class="capture">캡처 지점: 문서는 이 WebSocket을 이벤트·명령용으로 설명 · 통화 원음은 전화 채널(ACS 등)에서 녹음</text>

  <!-- Lane 4: Azure Communication Services -->
  <rect x="40" y="770" width="1200" height="266" rx="8" fill="#f0fdf4" fill-opacity=".7" stroke="#86efac"/>
  <rect x="52" y="778" width="620" height="22" rx="3" fill="#ffffff"/>
  <text x="64" y="794" class="zone-label">AZURE COMMUNICATION SERVICES · 전화·VoIP 통화를 ACS가 처리</text>

  <rect x="80" y="836" width="200" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="100" y="858" class="tag" fill="#475569">PHONE</text>
  <text x="180" y="884" text-anchor="middle" class="node">전화(PSTN) · VoIP</text>
  <text x="180" y="904" text-anchor="middle" class="small">발신자</text>

  <rect x="380" y="826" width="260" height="100" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="400" y="848" class="tag" fill="#166534">ACS</text>
  <text x="510" y="876" text-anchor="middle" class="node">Call Automation</text>
  <text x="510" y="898" text-anchor="middle" class="small">통화 제어 · 녹음 · 오디오 스트리밍</text>

  <rect x="760" y="826" width="200" height="100" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="780" y="848" class="tag" fill="#475569">APP SERVER</text>
  <text x="860" y="876" text-anchor="middle" class="node">WebSocket 서버</text>
  <text x="860" y="898" text-anchor="middle" class="small">PCM 16·24kHz mono</text>

  <rect x="1040" y="826" width="170" height="100" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
  <text x="1060" y="848" class="tag" fill="#075985">AI SERVICE</text>
  <text x="1125" y="876" text-anchor="middle" class="node">Realtime 등</text>
  <text x="1125" y="898" text-anchor="middle" class="small">음성 모델</text>

  <rect x="380" y="960" width="260" height="56" rx="6" fill="#ffffff" stroke="#16a34a" stroke-dasharray="5,4"/>
  <text x="510" y="984" text-anchor="middle" class="body">녹음 파일 · ACS 임시 저장소 24시간</text>
  <text x="510" y="1004" text-anchor="middle" class="small">BYOS를 설정하면 고객 Blob Storage</text>

  <path d="M282 876 H378" fill="none" stroke="#334155" stroke-width="2.6" marker-start="url(#vc-arrow-start)" marker-end="url(#vc-arrow)"/>
  <text x="330" y="868" text-anchor="middle" class="label">통화</text>
  <path d="M642 876 H758" fill="none" stroke="#334155" stroke-width="2.6" marker-start="url(#vc-arrow-start)" marker-end="url(#vc-arrow)"/>
  <text x="700" y="868" text-anchor="middle" class="label">오디오 스트리밍</text>
  <path d="M962 876 H1038" fill="none" stroke="#334155" stroke-width="2.6" marker-start="url(#vc-arrow-start)" marker-end="url(#vc-arrow)"/>
  <text x="1000" y="868" text-anchor="middle" class="label">중계</text>
  <path d="M510 926 V958" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#vc-arrow)"/>
  <text x="522" y="946" class="label">Call Recording</text>

  <circle cx="640" cy="960" r="7" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
  <circle cx="960" cy="826" r="7" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
  <text x="700" y="980" class="capture">캡처 지점: Call Recording 녹음 파일</text>
  <text x="700" y="1000" class="capture">또는 앱 서버가 받은 스트리밍 오디오</text>

  <!-- Notes and legend -->
  <text x="40" y="1062" class="small">ACS 오디오 스트리밍은 양방향이라 앱 서버가 AI 서비스로 중계한 응답 음성을 통화로 돌려보낼 수 있습니다.</text>
  <text x="40" y="1084" class="small">ACS의 Call Automation·Call Recording·오디오 스트리밍은 2028-09-30 이후 Teams 연동 시나리오에서만 지원됩니다.</text>

  <line x1="40" y1="1100" x2="1240" y2="1100" stroke="#cbd5e1"/>
  <line x1="64" y1="1120" x2="112" y2="1120" stroke="#334155" stroke-width="2.6" marker-end="url(#vc-arrow)"/>
  <text x="124" y="1124" class="legend">음성(오디오)</text>
  <line x1="236" y1="1120" x2="284" y2="1120" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#vc-link)"/>
  <text x="296" y="1124" class="legend">토큰·이벤트·제어</text>
  <circle cx="430" cy="1120" r="7" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
  <text x="446" y="1124" class="legend">원음 캡처 지점</text>
  <text x="1240" y="1124" text-anchor="end" class="source">원문 확인 2026-11-02 · 리전·기능 지원 범위 별도 확인</text>
</svg>
