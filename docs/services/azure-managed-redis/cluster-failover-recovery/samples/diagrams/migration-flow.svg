<text x="735.0" y="495.6" font-size="15" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">OSS 정책</text>
<text x="735.0" y="514.4" font-size="15" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">+ 클러스터 클라이언트 전환</text>
<polyline points="460,505 600,505" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#migration-flow-head-1e1e1e)"/>
<rect x="517.5" y="493.9" width="25.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="530.0" y="505.0" font-size="13" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">예</text>
<polyline points="300,570 300,610" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#migration-flow-head-1e1e1e)"/>
<rect x="274.5" y="578.9" width="51.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="300.0" y="590.0" font-size="13" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">아니요</text>
<polygon points="300.0,610 460,675.0 300.0,740 140,675.0" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="300.0" y="666.2" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">25GB 이하이고</text>
<text x="300.0" y="683.8" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">cross-slot 명령이 많나?</text>
<rect x="600" y="640" width="270" height="70" rx="10" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<text x="735.0" y="675.0" font-size="15" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Non-clustered 정책</text>
<polyline points="460,675 600,675" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#migration-flow-head-1e1e1e)"/>
<rect x="517.5" y="663.9" width="25.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="530.0" y="675.0" font-size="13" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">예</text>
<polyline points="300,740 300,800" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#migration-flow-head-1e1e1e)"/>
<rect x="274.5" y="758.9" width="51.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="300.0" y="770.0" font-size="13" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">아니요</text>
<rect x="160" y="800" width="280" height="70" rx="10" fill="#e5dbff" stroke="#1e1e1e" stroke-width="2"/>
<text x="300.0" y="825.6" font-size="15" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Enterprise 정책</text>
<text x="300.0" y="844.4" font-size="15" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">(생성 시 반드시 명시)</text>
<text x="600.0" y="383.1" font-size="13" fill="#868e96" text-anchor="start" dominant-baseline="central" xml:space="preserve">Enterprise 정책을 고르면</text>
<text x="600.0" y="399.4" font-size="13" fill="#868e96" text-anchor="start" dominant-baseline="central" xml:space="preserve">단일 엔드포인트 클라이언트로 전환</text>
<rect x="-20" y="900" width="910" height="56" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="435.0" y="928.0" font-size="15" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">⚠ 정책을 지정하지 않으면 OSS로 생성되며, OSS·Enterprise 정책은 생성 후 바꿀 수 없음</text>
</svg>
