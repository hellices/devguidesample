<svg xmlns="http://www.w3.org/2000/svg" viewBox="-44 -24 958 1004" width="958" height="1004" role="img" aria-label="Azure Cache for Redis에서 Azure Managed Redis로 옮길 때 클러스터링 정책 선택 흐름" font-family="&#x27;Segoe UI&#x27;, &#x27;Malgun Gothic&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, sans-serif">
<title>Azure Cache for Redis에서 Azure Managed Redis로 옮길 때 클러스터링 정책 선택 흐름</title>
<defs><marker id="migration-flow-head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs>
<rect x="-44" y="-24" width="958" height="1004" fill="#ffffff"/>
<rect x="130" y="0" width="340" height="54" rx="10" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="300.0" y="27.0" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">현재 Azure Cache for Redis 구성</text>
<polyline points="300,54 300,100" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#migration-flow-head-1e1e1e)"/>
<polygon points="300.0,100 460,165.0 300.0,230 140,165.0" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="300.0" y="156.2" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Enterprise /</text>
<text x="300.0" y="173.8" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Enterprise Flash 티어?</text>
<rect x="600" y="130" width="270" height="70" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="735.0" y="155.6" font-size="15" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">원본과 같은 정책을</text>
<text x="735.0" y="174.4" font-size="15" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">명시해 생성</text>
<polyline points="460,165 600,165" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#migration-flow-head-1e1e1e)"/>
<rect x="517.5" y="153.9" width="25.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="530.0" y="165.0" font-size="13" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">예</text>
<polyline points="300,230 300,270" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#migration-flow-head-1e1e1e)"/>
<rect x="274.5" y="238.9" width="51.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="300.0" y="250.0" font-size="13" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">아니요</text>
<polygon points="300.0,270 460,335.0 300.0,400 140,335.0" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="300.0" y="326.2" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">클러스터 클라이언트로</text>
<text x="300.0" y="343.8" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">연결 중인가?</text>
<rect x="600" y="300" width="270" height="70" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="735.0" y="325.6" font-size="15" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">OSS 정책 유지</text>
<text x="735.0" y="344.4" font-size="15" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">(호스트·포트·인증만 변경)</text>
<polyline points="460,335 600,335" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#migration-flow-head-1e1e1e)"/>
<rect x="517.5" y="323.9" width="25.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="530.0" y="335.0" font-size="13" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">예</text>
