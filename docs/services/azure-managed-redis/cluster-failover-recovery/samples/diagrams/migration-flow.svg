<rect x="274.5" y="408.9" width="51.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="300.0" y="420.0" font-size="13" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">아니요</text>
<polygon points="300.0,440 460,505.0 300.0,570 140,505.0" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="300.0" y="496.2" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">클라이언트를 클러스터</text>
<text x="300.0" y="513.8" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">클라이언트로 바꿀 수 있나?</text>
