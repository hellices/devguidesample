<text x="615.5" y="305.0" font-size="13" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">allkeys-*</text>
<text x="40.0" y="698.8" font-size="14" fill="#868e96" text-anchor="start" dominant-baseline="central" xml:space="preserve">삭제할 키 고르는 기준:  *-lru 오래 안 쓴 키  ·  *-lfu 적게 쓴 키  ·  *-random 무작위  ·  volatile-ttl 만료 임박</text>
<text x="40.0" y="724.8" font-size="14" fill="#868e96" text-anchor="start" dominant-baseline="central" xml:space="preserve">Azure Managed Redis는 샤드마다 메모리를 따로 보고 eviction을 판단합니다.</text>
