<text x="720.0" y="491.4" font-size="15" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">골라 삭제 후 저장</text>
<polyline points="530,305 720,305 720,450" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#eviction-flow-head-1e1e1e)"/>
