<text x="244.0" y="252.9" font-size="13" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">k9</text>
<text x="244.0" y="269.1" font-size="13" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">유휴 40초</text>
<text x="150.0" y="308.1" font-size="13" fill="#868e96" text-anchor="middle" dominant-baseline="central" xml:space="preserve">파란색 = 이번에 샘플링된 키</text>
