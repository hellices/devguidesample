<text x="550.0" y="232.5" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">k5  유휴 30초</text>
<polyline points="660,180 720,180" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#approximated-lru-head-1e1e1e)"/>
<rect x="720" y="140" width="200" height="80" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="820.0" y="170.6" font-size="15" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">③ 유휴 시간이</text>
<text x="820.0" y="189.4" font-size="15" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">가장 긴 키(k7) 삭제</text>
<polyline points="820,220 820,380 150,380 150,320" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#approximated-lru-head-868e96)"/>
<rect x="350.3" y="368.9" width="269.4" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="485.0" y="380.0" font-size="13" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central" xml:space="preserve">메모리가 한도 아래로 내려갈 때까지 반복</text>
<text x="0.0" y="428.8" font-size="14" fill="#1e1e1e" text-anchor="start" dominant-baseline="central" xml:space="preserve">• 모든 키를 접근 순서대로 정렬하지 않아 메모리를 아끼고, 후보 풀로 정확한 LRU에 가깝게 동작</text>
<text x="0.0" y="446.2" font-size="14" fill="#1e1e1e" text-anchor="start" dominant-baseline="central" xml:space="preserve">• 일부 키에 접근이 몰리는 패턴에서는 정확한 LRU와 차이가 거의 없음 (Redis 문서)</text>
<text x="0.0" y="463.8" font-size="14" fill="#1e1e1e" text-anchor="start" dominant-baseline="central" xml:space="preserve">• Azure Managed Redis에서는 샘플 수(maxmemory-samples)를 바꿀 수 없음</text>
