<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">AKS 위 Airflow DAG가 Azure DocumentDB change stream을 ADLS Gen2 Parquet으로 적재하는 구성</title>
  <desc id="desc">AKS의 airflow 네임스페이스에서 Airflow scheduler가 10분 구간이 닫힐 때마다 cslab 네임스페이스에 내보내기 파드를 만든다. 내보내기 파드는 프라이빗 엔드포인트를 거쳐 Azure DocumentDB의 change stream을 읽고, blob과 dfs 프라이빗 엔드포인트를 거쳐 ADLS Gen2에 Parquet 청크와 checkpoint를 쓴다. 스토리지 인증은 Microsoft Entra ID의 관리 ID와 워크로드 ID로 한다.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4a5a6a"/></marker></defs>
  <style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;fill:#1f2933;font-size:18px}.title{font-size:22px;font-weight:700}.label{font-size:16px;fill:#4a5a6a}.small{font-size:15px;fill:#3e4c59}.mono{font-family:Menlo,Consolas,monospace;font-size:14px;fill:#3e4c59}.boundary{fill:none;stroke:#9aa5b1;stroke-width:1.5;stroke-dasharray:6 5}.ns{fill:#f7f9fb;stroke:#bcc5ce;stroke-width:1.5}.box{fill:#ffffff;stroke:#52606d;stroke-width:1.5}.azure{fill:#eef4fb;stroke:#2f6aa3;stroke-width:1.5}.pe{fill:#ffffff;stroke:#2f6aa3;stroke-width:1.5}.flow{fill:none;stroke:#4a5a6a;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="1120" height="700" fill="white"/>
  <text x="30" y="42" class="title">Airflow DAG로 change stream을 Parquet에 적재하는 구성</text>

  <rect x="20" y="70" width="720" height="470" rx="10" class="boundary"/>
  <text x="38" y="96" class="label">VNet</text>
  <rect x="40" y="110" width="450" height="410" rx="10" class="boundary"/>
  <text x="58" y="136" class="label">AKS · Standard_D4s_v6 4대 · 워크로드 ID</text>

  <rect x="60" y="155" width="420" height="130" rx="8" class="ns"/>
  <text x="75" y="180" class="label">namespace airflow</text>
  <rect x="75" y="195" width="210" height="75" rx="6" class="box"/>
  <text x="180" y="226" text-anchor="middle">Airflow scheduler</text>
  <text x="180" y="252" text-anchor="middle" class="small">LocalExecutor · 10분 구간</text>
  <rect x="300" y="195" width="165" height="75" rx="6" class="box"/>
  <text x="382" y="226" text-anchor="middle">PostgreSQL</text>
  <text x="382" y="252" text-anchor="middle" class="small">메타데이터</text>

  <rect x="60" y="325" width="420" height="180" rx="8" class="ns"/>
  <text x="75" y="350" class="label">namespace cslab</text>
  <rect x="75" y="365" width="390" height="125" rx="6" class="box"/>
  <text x="270" y="398" text-anchor="middle">내보내기 파드</text>
  <text x="270" y="428" text-anchor="middle" class="small">lake_export.py · 실행마다 생성</text>
  <text x="270" y="456" text-anchor="middle" class="small">서비스 계정 cs-lake</text>

  <path d="M250 270 V360" class="flow"/>
  <text x="262" y="310" class="small">KubernetesPodOperator</text>

  <rect x="540" y="375" width="180" height="50" rx="6" class="pe"/>
  <text x="630" y="406" text-anchor="middle" class="small">PE · MongoCluster</text>
  <rect x="540" y="445" width="180" height="50" rx="6" class="pe"/>
  <text x="630" y="476" text-anchor="middle" class="small">PE · blob, dfs</text>

  <path d="M465 400 H535" class="flow"/>
  <text x="514" y="392" text-anchor="middle" class="small">읽기</text>
  <path d="M720 400 H775" class="flow"/>
  <path d="M465 470 H535" class="flow"/>
  <text x="514" y="462" text-anchor="middle" class="small">쓰기</text>
  <path d="M720 470 H775" class="flow"/>

  <rect x="780" y="330" width="320" height="100" rx="8" class="azure"/>
  <text x="940" y="362" text-anchor="middle">Azure DocumentDB</text>
  <text x="940" y="390" text-anchor="middle" class="small">M30 · shard 1개 · 서버 7.0</text>
  <text x="940" y="416" text-anchor="middle" class="small">공용 액세스 끔 · change stream</text>

  <rect x="780" y="445" width="320" height="140" rx="8" class="azure"/>
  <text x="940" y="478" text-anchor="middle">ADLS Gen2 · 파일 시스템 cdc</text>
  <text x="940" y="508" text-anchor="middle" class="mono">orders/dt=…/hour=…/part-*.parquet</text>
  <text x="940" y="534" text-anchor="middle" class="mono">_checkpoints/orders.json</text>
  <text x="940" y="564" text-anchor="middle" class="small">공용 액세스·공유 키 끔</text>

  <rect x="780" y="615" width="320" height="70" rx="8" class="azure"/>
  <text x="940" y="643" text-anchor="middle">Microsoft Entra ID</text>
  <text x="940" y="670" text-anchor="middle" class="small">관리 ID · federated credential</text>
  <path d="M200 490 V650 H775" class="flow"/>
  <text x="480" y="640" text-anchor="middle" class="small">워크로드 ID 토큰</text>
</svg>
