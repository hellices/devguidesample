    <line x1="704" y1="236" x2="744" y2="236" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="960" y1="236" x2="1000" y2="236" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

