    <rect x="1012" y="200" width="28" height="12" rx="2" fill="none" stroke="#2e5aa8" stroke-opacity="0.45" stroke-width="0.8"/>
    <text x="1026" y="209" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">AI</text>
    <text x="1112" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', Arial, sans-serif" text-anchor="middle">Application Insights</text>
    <text x="1112" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">customMetrics</text>

    <line x1="40" y1="408" x2="1240" y2="408" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
    <text x="40" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CONTRACT</text>
