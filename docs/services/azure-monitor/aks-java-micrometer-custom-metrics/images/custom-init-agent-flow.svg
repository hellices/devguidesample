<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="custom-init-agent-flow-title custom-init-agent-flow-desc">
    <title id="custom-init-agent-flow-title">AKS custom 3.7.9 init image 흐름</title>
    <desc id="custom-init-agent-flow-desc">Checksum으로 검증한 Application Insights Java 3.7.9 ACR image가 init container와 emptyDir를 통해 Spring Boot 4 애플리케이션에 agent를 공급합니다.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
    </defs>

    <rect width="1280" height="480" fill="#f5f5f5"/>
    <text x="40" y="30" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">RECOMMENDED · CUSTOM 3.7.9 · AKS</text>
    <text x="40" y="62" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif KR', Georgia, serif">checksum-pinned init image로 agent 공급</text>

