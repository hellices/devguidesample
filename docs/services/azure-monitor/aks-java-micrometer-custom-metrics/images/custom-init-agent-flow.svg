    <text x="852" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">-javaagent · Micrometer</text>

    <rect x="1000" y="188" width="224" height="96" rx="6" fill="#f5f5f5"/>
