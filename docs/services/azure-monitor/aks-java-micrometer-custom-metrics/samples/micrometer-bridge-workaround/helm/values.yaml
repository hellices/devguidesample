replicaCount: 1

image:
  repository: ghcr.io/example/orders-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  name: orders-api

monitoring:
  javaAgentMode: managed
  micrometerBridgeEnabled: false
  javaAgentImage: ""
  managedInstrumentationRef: application-insights
  connectionStringSecret:
    name: application-insights
    key: connection-string
