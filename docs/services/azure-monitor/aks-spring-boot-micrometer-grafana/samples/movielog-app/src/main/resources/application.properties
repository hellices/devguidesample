spring.application.name=spring-sample
spring.config.import=optional:file:.env[.properties]

# Database: PostgreSQL, values come from the environment (see .env.sample)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/springsample}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:springsample}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Web and error handling
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Metrics (see docs/monitoring.md). /actuator/prometheus is limited to app.metrics.scrape-allowed-ips.
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
app.metrics.scrape-allowed-ips=${METRICS_SCRAPE_ALLOWED_IPS:127.0.0.1,::1}

# Logging
logging.level.root=INFO
logging.level.com.example.springsample=INFO

# OpenAPI / Swagger UI: off by default, enabled in the dev profile
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.csrf.enabled=true

# Movie data: TMDB (search, posters) + OMDb (Rotten Tomatoes, IMDb, Metacritic scores).
# Keys come from the environment or .env; a blank key disables that source.
app.movies.tmdb.api-key=${TMDB_API_KEY:}
app.movies.tmdb.language=ko-KR
app.movies.omdb.api-key=${OMDB_API_KEY:}
app.movies.sync-ttl=7d
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=5s
