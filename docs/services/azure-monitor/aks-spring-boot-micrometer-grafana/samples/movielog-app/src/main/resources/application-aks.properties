# AKS lab profile: PostgreSQL in the cluster, no external movie API keys.
# Seeded movies are served from the local catalog (cache_hit), so the app works without TMDB_API_KEY.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/aks-seed.sql

# The Application Insights agent reads the in-process MeterRegistry; no metrics endpoint is exposed.
management.endpoints.web.exposure.include=health

# Allowlist: every exported meter becomes billable customMetrics rows.
management.metrics.enable.all=false
management.metrics.enable.movielog=true
