# Local development: file-based H2 instead of PostgreSQL, stored in ./.h2 (git-ignored).
# A file database survives DevTools restarts and app restarts; delete ./.h2 to start over.
spring.datasource.url=jdbc:h2:file:./.h2/springsample
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Swagger UI at /swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

logging.level.com.example.springsample=DEBUG
