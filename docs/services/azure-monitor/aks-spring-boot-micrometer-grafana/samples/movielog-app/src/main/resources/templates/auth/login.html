<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body class="light">
<header th:replace="~{fragments/layout :: header}"></header>

<main class="responsive">
	<article class="round auth-card">
		<h5>로그인</h5>

		<p class="primary-text" th:if="${param.registered}">회원가입이 완료되었습니다. 로그인해 주세요.</p>
		<p class="primary-text" th:if="${param.logout}">로그아웃되었습니다.</p>
		<p class="error-text" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>

		<form th:action="@{/login}" method="post">
			<div class="field label prefix border">
				<i>person</i>
				<input type="text" id="username" name="username" placeholder=" " autocomplete="username" required autofocus>
				<label for="username">아이디</label>
			</div>
			<div class="field label prefix border">
				<i>lock</i>
				<input type="password" id="password" name="password" placeholder=" " autocomplete="current-password" required>
				<label for="password">비밀번호</label>
			</div>
			<button class="responsive">로그인</button>
		</form>

		<p class="center-align">
			계정이 없나요? <a class="link" th:href="@{/signup}">회원가입</a>
		</p>
	</article>
</main>
</body>
</html>
