<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('오류')}"></head>
<body class="light">
<header th:replace="~{fragments/layout :: header}"></header>

<main class="responsive">
	<article class="round center-align large-padding">
		<i class="extra">
			[[${status == 404} ? 'search_off' : (${status == 403} ? 'block' : 'error')]]
		</i>
		<h5 th:switch="${status}">
			<span th:case="404">페이지나 리뷰를 찾을 수 없습니다.</span>
			<span th:case="403">권한이 없습니다.</span>
			<span th:case="*">요청을 처리할 수 없습니다.</span>
		</h5>
		<p class="secondary-text" th:text="|오류 코드 ${status}|">오류 코드</p>
		<a class="button" th:href="@{/reviews}">
			<i>home</i>
			<span>리뷰 목록으로</span>
		</a>
	</article>
</main>
</body>
</html>
