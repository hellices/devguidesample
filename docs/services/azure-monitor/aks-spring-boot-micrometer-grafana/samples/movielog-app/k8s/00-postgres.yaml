apiVersion: v1
kind: Namespace
metadata:
  name: movielog
---
# Lab-only database. Data lives in an emptyDir: it survives a container restart but is lost
# when the Pod is deleted or replaced.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: movielog
spec:
  replicas: 1
  # A rolling update would briefly run a second, empty database behind the same Service.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_DB
              value: springsample
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: movielog-db
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: movielog-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d springsample"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: movielog
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
