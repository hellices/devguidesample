<text x="400" y="539" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="middle">msdb 작업 이력</text>
<rect x="580" y="325" width="220" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="690.0" y="357.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">windows_exporter</text>
<text x="690.0" y="378.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">성능 카운터 · OS</text>
<rect x="580" y="412" width="220" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="690.0" y="444.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">sql_exporter</text>
<text x="690.0" y="465.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">DMV 쿼리 → 지표</text>
<rect x="580" y="500" width="220" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<text x="690.0" y="532.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Prometheus 에이전트</text>
<text x="690.0" y="553.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">30초마다 scrape · 관리 ID로 전송</text>
<rect x="900" y="320" width="270" height="90" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<text x="1035.0" y="362.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Azure Monitor workspace</text>
<text x="1035.0" y="383.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">managed Prometheus</text>
<rect x="900" y="110" width="270" height="90" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
<text x="1035.0" y="152.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Azure Managed Grafana</text>
<text x="1035.0" y="173.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">SQL Server VM 상태 대시보드</text>
