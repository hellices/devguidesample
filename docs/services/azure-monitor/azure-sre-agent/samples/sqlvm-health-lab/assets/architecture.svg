<rect x="280" y="325" width="240" height="245" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
<text x="400.0" y="452.5" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle"></text>
<text x="400" y="360" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">SQL Server 2022</text>
<text x="400" y="385" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">읽기 전용 로그인</text>
<rect x="300" y="405" width="200" height="30" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
<text x="400" y="425" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="middle">DMV · 잠금 · 세션</text>
<rect x="300" y="443" width="200" height="30" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
<text x="400" y="463" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Query Store</text>
<rect x="300" y="481" width="200" height="30" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
<text x="400" y="501" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="middle">로그인 감사 (XE)</text>
