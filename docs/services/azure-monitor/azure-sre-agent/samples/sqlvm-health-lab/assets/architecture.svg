<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif">
<title>SQL Server VM 점검 실습 구성도</title>
<desc>운영자가 Azure SRE Agent에 질문하면 VNet의 에이전트 서브넷에서 Python 도구가 실행되어 Private Endpoint 뒤 Key Vault의 비밀번호로 SQL Server에 직접 SQL을 실행한다. SQL Server VM의 exporter 지표는 Prometheus 에이전트가 Azure Monitor workspace로 보내고, Azure Managed Grafana와 에이전트가 PromQL로 조회한다.</desc>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
</defs>
<rect width="1200" height="640" fill="#ffffff"/>
<rect x="30" y="70" width="170" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="115.0" y="102.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">운영자</text>
<text x="115.0" y="123.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">채팅 · 대시보드</text>
<rect x="240" y="40" width="600" height="570" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.5" stroke-dasharray="0"/>
<text x="254" y="62" font-size="13" font-weight="bold" fill="#475569" text-anchor="start">가상 네트워크 (공용 IP 없음)</text>
<rect x="260" y="75" width="560" height="170" rx="12" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="274" y="97" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">에이전트 서브넷</text>
