<text x="405.0" y="164.5" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Azure SRE Agent</text>
<text x="405.0" y="185.5" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">Python 도구 3개 · 스킬</text>
<text x="405" y="205" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">질문할 때만 실행</text>
