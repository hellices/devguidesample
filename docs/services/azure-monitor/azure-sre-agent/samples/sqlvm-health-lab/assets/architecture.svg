<text x="574" y="132" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="start"></text>
<rect x="575" y="125" width="210" height="85" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="680.0" y="164.5" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Key Vault</text>
<text x="680.0" y="185.5" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">Private Endpoint · 비밀번호</text>
