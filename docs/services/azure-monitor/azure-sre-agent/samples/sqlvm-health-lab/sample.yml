title: SQL Server VM health check with a VNet-integrated Azure SRE Agent
description: Deploys a private SQL Server VM, a VNet-integrated Azure SRE Agent whose Python tools check health, locks, long-running and slow queries, logins, storage, table growth, and SQL Agent jobs, and an exporter pipeline to Azure Monitor managed Prometheus with an Azure Managed Grafana dashboard.
