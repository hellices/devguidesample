<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <title id="t">Azure Managed Lustre 연결 구조</title>
  <desc id="d">고객 VNet 안에 AMLFS 전용 subnet이 있고, VM·AKS·CycleCloud client subnet이 TCP 988과 1019-1023으로 직접 연결된다. AMLFS는 Blob Storage와 HSM import·export로 연결되며, 온프레미스 데이터는 AzCopy로 Blob을 거쳐 들어온다.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="900" height="500" fill="#ffffff"/>

  <rect x="16" y="16" width="640" height="468" rx="12" fill="#f8fafc" stroke="#0078d4" stroke-dasharray="6 4"/>
  <text x="32" y="42" font-size="15" font-weight="700" fill="#0b4f8a">고객 VNet · 단일 리전 · 같은 가용성 영역 권장</text>

  <rect x="36" y="62" width="250" height="400" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="161" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">client subnet (Linux)</text>
  <rect x="54" y="104" width="214" height="92" rx="8" fill="#fff" stroke="#818cf8"/>
  <text x="161" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b4b">VM · VMSS</text>
  <text x="161" y="150" text-anchor="middle" font-size="12" fill="#3730a3">amlfs-lustre-client (kmod/DKMS)</text>
  <text x="161" y="170" text-anchor="middle" font-size="12" fill="#3730a3">mount -t lustre MGS@tcp:/lustrefs</text>
  <rect x="54" y="210" width="214" height="110" rx="8" fill="#fff" stroke="#818cf8"/>
  <text x="161" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b4b">AKS</text>
  <text x="161" y="256" text-anchor="middle" font-size="12" fill="#3730a3">Azure Lustre CSI driver</text>
  <text x="161" y="276" text-anchor="middle" font-size="12" fill="#3730a3">정적: 기존 AMLFS의 MGS IP</text>
  <text x="161" y="296" text-anchor="middle" font-size="12" fill="#3730a3">동적: PVC마다 AMLFS 생성</text>
  <rect x="54" y="334" width="214" height="110" rx="8" fill="#fff" stroke="#818cf8"/>
  <text x="161" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b4b">CycleCloud · Slurm</text>
  <text x="161" y="380" text-anchor="middle" font-size="12" fill="#3730a3">mount type = lustre</text>
  <text x="161" y="400" text-anchor="middle" font-size="12" fill="#3730a3">CCWS: 새 AMLFS 생성 또는</text>
  <text x="161" y="420" text-anchor="middle" font-size="12" fill="#3730a3">기존 AMLFS mount</text>

  <rect x="400" y="62" width="236" height="400" rx="10" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="518" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#134e4a">AMLFS 전용 subnet</text>
  <text x="518" y="108" text-anchor="middle" font-size="12" fill="#115e59">서비스 관리 · 호스트 접근 불가</text>
  <rect x="418" y="124" width="200" height="46" rx="8" fill="#fff" stroke="#14b8a6"/>
  <text x="518" y="152" text-anchor="middle" font-size="13" fill="#134e4a">MGS (client 접속점)</text>
  <rect x="418" y="182" width="200" height="46" rx="8" fill="#fff" stroke="#14b8a6"/>
  <text x="518" y="210" text-anchor="middle" font-size="13" fill="#134e4a">MDS · MDT</text>
  <rect x="418" y="240" width="200" height="66" rx="8" fill="#fff" stroke="#14b8a6"/>
  <text x="518" y="266" text-anchor="middle" font-size="13" fill="#134e4a">OSS · OST</text>
  <text x="518" y="288" text-anchor="middle" font-size="12" fill="#115e59">Premium SSD LRS</text>
  <rect x="418" y="318" width="200" height="66" rx="8" fill="#fff" stroke="#14b8a6"/>
  <text x="518" y="344" text-anchor="middle" font-size="13" fill="#134e4a">HSM 데이터 이동 노드</text>
  <text x="518" y="366" text-anchor="middle" font-size="12" fill="#115e59">import · export · auto</text>
  <text x="518" y="414" text-anchor="middle" font-size="12" fill="#115e59">tier: 20–500 MB/s per TiB</text>
  <text x="518" y="434" text-anchor="middle" font-size="12" fill="#115e59">유지 관리 창 · Azure Monitor</text>

  <line x1="290" y1="150" x2="396" y2="150" stroke="#0f766e" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="290" y1="265" x2="396" y2="265" stroke="#0f766e" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="290" y1="389" x2="396" y2="350" stroke="#0f766e" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="343" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">TCP 988</text>
  <text x="343" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">1019–1023</text>

  <rect x="690" y="140" width="190" height="130" rx="10" fill="#fefce8" stroke="#ca8a04"/>
  <text x="785" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">Azure Blob Storage</text>
  <text x="785" y="192" text-anchor="middle" font-size="12" fill="#854d0e">HSM 백엔드 · 장기 보관</text>
  <text x="785" y="212" text-anchor="middle" font-size="12" fill="#854d0e">ZRS·GRS로 영역·리전</text>
  <text x="785" y="232" text-anchor="middle" font-size="12" fill="#854d0e">이중화 보완</text>
  <line x1="640" y1="350" x2="740" y2="274" stroke="#ca8a04" stroke-width="2.5" marker-end="url(#g)" marker-start="url(#g)"/>
  <text x="646" y="372" font-size="12" fill="#854d0e">import / export</text>

  <rect x="690" y="380" width="190" height="84" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="785" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">온프레미스 · Azure Local</text>
  <text x="785" y="430" text-anchor="middle" font-size="12" fill="#334155">직접 mount 미문서화</text>
  <text x="785" y="450" text-anchor="middle" font-size="12" fill="#334155">AzCopy로 Blob에 업로드</text>
  <line x1="785" y1="376" x2="785" y2="274" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#g)"/>
</svg>
