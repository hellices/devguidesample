<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <title id="t">Lustre 구성 요소와 I/O 경로</title>
  <desc id="d">Client가 MGS에서 구성을, MDS에서 layout을 받은 뒤 OSS의 여러 OST와 직접 데이터를 주고받는 구조. 모든 통신은 LNet 위에서 이루어진다.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>

  <rect x="24" y="70" width="230" height="300" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="139" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">Lustre clients</text>
  <text x="139" y="120" text-anchor="middle" font-size="12" fill="#3730a3">kernel module, POSIX mount</text>
  <rect x="44" y="140" width="190" height="40" rx="6" fill="#fff" stroke="#818cf8"/>
  <text x="139" y="165" text-anchor="middle" font-size="13" fill="#1e1b4b">MGC (management)</text>
  <rect x="44" y="192" width="190" height="40" rx="6" fill="#fff" stroke="#818cf8"/>
  <text x="139" y="217" text-anchor="middle" font-size="13" fill="#1e1b4b">MDC ×N → LMV</text>
  <rect x="44" y="244" width="190" height="40" rx="6" fill="#fff" stroke="#818cf8"/>
  <text x="139" y="269" text-anchor="middle" font-size="13" fill="#1e1b4b">OSC ×N → LOV</text>
  <text x="139" y="320" text-anchor="middle" font-size="12" fill="#3730a3">수천–수만 노드가</text>
  <text x="139" y="338" text-anchor="middle" font-size="12" fill="#3730a3">하나의 namespace 공유</text>

  <rect x="560" y="24" width="296" height="66" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="708" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">MGS + MGT</text>
  <text x="708" y="74" text-anchor="middle" font-size="12" fill="#334155">클러스터 구성 정보 저장·배포</text>

  <rect x="560" y="110" width="296" height="96" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="708" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">MDS + MDT (DNE로 여러 개)</text>
  <text x="708" y="160" text-anchor="middle" font-size="12" fill="#9a3412">namespace·권한·file layout</text>
  <text x="708" y="178" text-anchor="middle" font-size="12" fill="#9a3412">OST object 할당, open 후 I/O 비관여</text>
  <text x="708" y="196" text-anchor="middle" font-size="12" fill="#9a3412">작은 파일은 DoM으로 MDT에 저장 가능</text>

  <rect x="560" y="240" width="296" height="160" rx="10" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="708" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#134e4a">OSS + OST (수십–수천 개)</text>
  <rect x="580" y="282" width="120" height="44" rx="6" fill="#fff" stroke="#14b8a6"/>
  <text x="640" y="309" text-anchor="middle" font-size="12" fill="#134e4a">OSS 1: OST 0, 1</text>
  <rect x="716" y="282" width="120" height="44" rx="6" fill="#fff" stroke="#14b8a6"/>
  <text x="776" y="309" text-anchor="middle" font-size="12" fill="#134e4a">OSS 2: OST 2, 3</text>
  <text x="708" y="352" text-anchor="middle" font-size="12" fill="#115e59">파일 데이터를 stripe 단위 object로 분산</text>
  <text x="708" y="372" text-anchor="middle" font-size="12" fill="#115e59">backend: ldiskfs 또는 ZFS + RAID</text>

  <line x1="256" y1="160" x2="556" y2="58" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="268" y="104" font-size="12" fill="#334155">① mount: 구성 조회</text>
  <line x1="256" y1="212" x2="556" y2="158" stroke="#334155" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="330" y="168" font-size="12" fill="#334155">② open: layout(EA)·lock</text>
  <line x1="256" y1="264" x2="556" y2="304" stroke="#0f766e" stroke-width="3" marker-end="url(#b)" marker-start="url(#b)"/>
  <line x1="256" y1="284" x2="556" y2="348" stroke="#0f766e" stroke-width="3" marker-end="url(#b)" marker-start="url(#b)"/>
  <text x="270" y="388" font-size="12" font-weight="700" fill="#0f766e">③ read/write: OSS와 직접 병렬 I/O</text>

  <rect x="24" y="420" width="832" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="440" y="442" text-anchor="middle" font-size="13" fill="#1e293b">LNet: tcp(ksocklnd) · o2ib(InfiniBand·RoCE, RDMA) · LNet router로 서로 다른 fabric 연결</text>
</svg>
