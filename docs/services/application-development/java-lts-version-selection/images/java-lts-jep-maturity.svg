<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="java-lts-jep-title java-lts-jep-desc">
    <title id="java-lts-jep-title">Java LTS별 핵심 JEP 성숙도</title>
    <desc id="java-lts-jep-desc">Java 8, 17, 21, 25에서 언어, 동시성, 런타임 핵심 JEP가 final, preview, incubator, product opt-in 중 어느 단계에 있는지 보여 주는 두 줄 타임라인.</desc>
    <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;display=swap');
                .sans { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
        .serif { font-family: 'Instrument Serif', 'Noto Serif KR', serif; }
        .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
        .release { font-size: 28px; font-weight: 600; fill: #2d3142; }
        .year { font-size: 9px; font-weight: 500; letter-spacing: 0.16em; fill: #7a8399; }
        .track { font-size: 14px; font-weight: 600; fill: #2d3142; }
        .track-sub { font-size: 8px; font-weight: 500; letter-spacing: 0.14em; fill: #7a8399; }
        .jep { font-size: 9px; font-weight: 600; letter-spacing: 0.10em; fill: #4f5d75; }
        .name { font-size: 14px; font-weight: 600; fill: #2d3142; }
        .status { font-size: 8.5px; font-weight: 500; fill: #4f5d75; }
        .legend { font-size: 8.5px; fill: #4f5d75; }
      </style>
      <marker id="java-lts-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <rect width="1280" height="780" fill="#f5f5f5"/>

    <text x="40" y="36" class="mono track-sub">JAVA LTS · JEP MATURITY MAP</text>
    <text x="40" y="72" class="serif" font-size="28" fill="#2d3142">Java LTS별 핵심 JEP 성숙도</text>
    <text x="40" y="96" class="sans" font-size="12" fill="#4f5d75">카드의 연도는 기능 계보의 단계이며, 비-LTS release에서 final이 된 경우도 함께 표시합니다.</text>

