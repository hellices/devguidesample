<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 820" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Foundry Toolbox as a managed MCP endpoint</title>
  <desc id="desc">MCP-compatible clients authenticate to a Foundry project and consume a versioned toolbox. Toolbox manages connections and backend authentication for MCP, OpenAPI and search tools. Project networking governs access; custom MCP code is hosted elsewhere and APIM is optional.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34536f"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#162b40;font-size:20px}.title{font-size:28px;font-weight:700}.small{font-size:18px}.box{fill:#edf5ff;stroke:#2565a4;stroke-width:2}.managed{fill:#f3efff;stroke:#7453a6;stroke-width:2}.identity{fill:#fff7e7;stroke:#9c661c;stroke-width:2}.backend{fill:#eef8f1;stroke:#327449;stroke-width:2}.flow{fill:none;stroke:#34536f;stroke-width:2.5;marker-end:url(#arrow)}.boundary{fill:#faf8ff;stroke:#a096bb;stroke-width:2;stroke-dasharray:8 6}</style>
  <rect width="1160" height="820" fill="white"/>
  <text x="30" y="45" class="title">Foundry Toolbox: shared tools, credentials and versions</text>
  <rect x="350" y="100" width="450" height="580" rx="18" class="boundary"/>
  <text x="372" y="139">Microsoft Foundry project</text>
  <rect x="30" y="305" width="245" height="155" rx="12" class="box"/>
  <text x="152" y="348" text-anchor="middle"><tspan x="152">MCP-compatible clients</tspan><tspan x="152" dy="34" class="small">VS Code / Inspector</tspan><tspan x="152" dy="29" class="small">Foundry / Agent Framework</tspan><tspan x="152" dy="29" class="small">LangGraph / custom agents</tspan></text>
  <rect x="385" y="190" width="380" height="125" rx="12" class="identity"/>
  <text x="575" y="231" text-anchor="middle"><tspan x="575">Project access control</tspan><tspan x="575" dy="33" class="small">Entra access token + project RBAC</tspan><tspan x="575" dy="28" class="small">Scope: https://ai.azure.com/.default</tspan></text>
  <rect x="385" y="365" width="380" height="125" rx="12" class="managed"/>
  <text x="575" y="405" text-anchor="middle"><tspan x="575">Toolbox MCP consumer endpoint</tspan><tspan x="575" dy="33" class="small">Curated MCP / OpenAPI / tools</tspan><tspan x="575" dy="28" class="small">Serves the selected default version</tspan></text>
  <rect x="385" y="540" width="380" height="105" rx="12" class="managed"/>
  <text x="575" y="580" text-anchor="middle"><tspan x="575">Connections and policies</tspan><tspan x="575" dy="31" class="small">Backend auth / versions / guardrails</tspan></text>
  <rect x="875" y="135" width="255" height="110" rx="12" class="backend"/>
  <text x="1002" y="180" text-anchor="middle"><tspan x="1002">Microsoft Learn MCP</tspan><tspan x="1002" dy="32" class="small">Anonymous backend</tspan></text>
  <rect x="875" y="320" width="255" height="135" rx="12" class="backend"/>
  <text x="1002" y="362" text-anchor="middle"><tspan x="1002">Remote MCP servers</tspan><tspan x="1002" dy="32" class="small">GitHub / custom Azure MCP</tspan><tspan x="1002" dy="28" class="small">Backend-specific auth</tspan></text>
  <rect x="875" y="535" width="255" height="110" rx="12" class="backend"/>
  <text x="1002" y="578" text-anchor="middle"><tspan x="1002">OpenAPI / Search / more</tspan><tspan x="1002" dy="32" class="small">Per-tool authentication</tspan></text>
  <path d="M275 375H315V250H385" class="flow"/>
  <path d="M575 315V365" class="flow"/><path d="M575 490V540" class="flow"/>
  <path d="M765 590H830V190H875" class="flow"/>
  <path d="M830 387H875" class="flow"/><path d="M830 590H875" class="flow"/>
  <text x="30" y="726" class="small">Custom MCP server code runs on its hosting service, not inside the Toolbox configuration.</text>
  <text x="30" y="758" class="small">Private access and backend egress follow the Foundry project's networking. APIM can be added if needed.</text>
  <text x="30" y="790" class="small">Use a version-specific endpoint before promoting a new default version.</text>
</svg>
