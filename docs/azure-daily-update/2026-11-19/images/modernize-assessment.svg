<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="modernize-title modernize-desc">
  <title id="modernize-title">Modernize CLI의 애플리케이션·SQL Server 통합 평가</title>
  <desc id="modernize-desc">Windows 로컬에서 애플리케이션 설정으로 SQL Server를 발견하고 Full analysis로 앱과 DB를 평가해 연결된 보고서를 만듭니다. DB 이전과 새 성능 데이터 수집은 이 평가에 포함되지 않습니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="960" height="440" fill="#f5f5f5"/>
  <g font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2d3142">
    <text x="40" y="44" font-size="28">Modernize CLI: 앱과 DB를 연결한 평가</text>
    <rect x="40" y="72" width="880" height="276" rx="8" fill="#ececec" stroke="#bfc0c0"/>
    <text x="64" y="104" font-size="14" font-weight="600">Windows 로컬 실행 · Full analysis</text>
    <g fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)">
      <path d="M304 168 H352"/>
      <path d="M592 168 H640"/>
      <path d="M472 216 V248"/>
    </g>
    <rect x="64" y="136" width="240" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
    <text x="184" y="168" text-anchor="middle" font-size="14" font-weight="600">애플리케이션 소스·설정</text>
    <text x="184" y="192" text-anchor="middle" font-size="12">코드 · 의존성 · DB endpoint</text>
    <rect x="352" y="136" width="240" height="80" rx="6" fill="#fff3ed" stroke="#eb6c36"/>
    <text x="472" y="168" text-anchor="middle" font-size="14" font-weight="600">앱 평가 + SQL 평가 skill</text>
    <text x="472" y="192" text-anchor="middle" font-size="12">연결 대상 발견 또는 명시</text>
    <rect x="640" y="136" width="256" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
    <text x="768" y="168" text-anchor="middle" font-size="14" font-weight="600">연결된 평가 보고서</text>
    <text x="768" y="192" text-anchor="middle" font-size="12">앱 결과에서 DB 결과로 이동</text>
    <rect x="352" y="248" width="240" height="72" rx="6" fill="#fff" stroke="#4f5d75"/>
    <text x="472" y="276" text-anchor="middle" font-size="14" font-weight="600">로컬·온프레미스 SQL Server</text>
    <text x="472" y="300" text-anchor="middle" font-size="12">Hyperscale 이전 호환성 평가</text>
    <path d="M40 372 H920" stroke="#bfc0c0"/>
    <text x="40" y="400" font-size="14">평가 범위: 호환성·차단 요인 확인 · 기존 성능 데이터가 있으면 sizing 요청</text>
    <text x="40" y="424" font-size="12" fill="#4f5d75">포함하지 않는 작업: DB 이전 · Azure 리소스 생성 · 새 성능 데이터 수집</text>
  </g>
</svg>
