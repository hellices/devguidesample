<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 544" role="img" aria-labelledby="azure-mcp-title azure-mcp-desc">
  <title id="azure-mcp-title">Azure MCP Server의 도구 호출 경로</title>
  <desc id="azure-mcp-desc">MCP client가 서버의 도구 계약을 통해 Azure API에 접근한다. Terraform export와 policy 검증 도구는 별도 로컬 실행을 위한 명령을 생성한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    <style>
      text { font-family: "Noto Sans KR", sans-serif; fill: #2d3142; font-size: 22px; }
      .name { font-weight: 600; }
      .detail { fill: #4f5d75; font-size: 19px; }
    </style>
  </defs>
  <rect width="640" height="544" fill="#f5f5f5"/>
  <path d="M320 120 V168" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M320 268 V316" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)"/>
  <rect x="112" y="40" width="416" height="80" rx="8" fill="#ececec" stroke="#7a8399"/>
  <text x="320" y="74" text-anchor="middle" class="name">AI agent / MCP client</text>
  <text x="320" y="102" text-anchor="middle" class="detail">도구 검색 · 입력 구성 · 호출</text>
  <rect x="72" y="168" width="496" height="100" rx="8" fill="#fff1e9" stroke="#eb6c36"/>
  <text x="320" y="208" text-anchor="middle" class="name">Azure MCP Server 3.0</text>
  <text x="320" y="240" text-anchor="middle" class="detail">도구 계약 · 인증 · 입력 검증</text>
  <rect x="112" y="316" width="416" height="88" rx="8" fill="#ffffff" stroke="#2d3142"/>
  <text x="320" y="352" text-anchor="middle" class="name">Azure APIs</text>
  <text x="320" y="382" text-anchor="middle" class="detail">Backup · Recovery · Advisor</text>
  <line x1="40" y1="440" x2="600" y2="440" stroke="#bfc0c0"/>
  <text x="320" y="476" text-anchor="middle" class="detail">Terraform export · policy 검증은</text>
  <text x="320" y="508" text-anchor="middle" class="detail">명령 생성 후 로컬에서 별도 실행</text>
</svg>
