<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 664" role="img" aria-labelledby="http-ddos-title http-ddos-desc">
  <title id="http-ddos-title">HTTP DDoS의 two-stage 평가</title>
  <desc id="http-ddos-desc">Profile 전체 임계값을 초과할 때 client IP 또는 geo 임계값을 평가한다. Geo 규칙은 Preview이며, 기본 Log action을 확인한 뒤 방어 action을 선택한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    <style>
      text { font-family: "Noto Sans KR", sans-serif; fill: #2d3142; font-size: 22px; }
      .name { font-weight: 600; }
      .detail { fill: #4f5d75; font-size: 19px; }
    </style>
  </defs>
  <rect width="640" height="664" fill="#f5f5f5"/>
  <path d="M320 120 V164" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M320 264 V324" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <path d="M320 444 V488" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="96" y="40" width="448" height="80" rx="8" fill="#ececec" stroke="#7a8399"/>
  <text x="320" y="74" text-anchor="middle" class="name">Front Door profile별 학습</text>
  <text x="320" y="102" text-anchor="middle" class="detail">충분한 정상 트래픽 이력 필요</text>
  <rect x="72" y="164" width="496" height="100" rx="8" fill="#fff1e9" stroke="#eb6c36"/>
  <text x="320" y="204" text-anchor="middle" class="name">1. Profile 전체 요청률 평가</text>
  <text x="320" y="236" text-anchor="middle" class="detail">전체 임계값을 초과할 때만 다음 단계</text>
  <rect x="72" y="324" width="496" height="120" rx="8" fill="#ffffff" stroke="#2d3142"/>
  <text x="320" y="360" text-anchor="middle" class="name">2. 더 세밀한 임계값 평가</text>
  <text x="320" y="392" text-anchor="middle" class="detail">Client IP · 의심 bot — GA</text>
  <text x="320" y="424" text-anchor="middle" class="detail">주요 geo별 · 나머지 geo 합산 — Preview</text>
  <rect x="112" y="488" width="416" height="88" rx="8" fill="#ececec" stroke="#7a8399"/>
  <text x="320" y="524" text-anchor="middle" class="name">규칙에 설정된 action 적용</text>
  <text x="320" y="554" text-anchor="middle" class="detail">기본 Log · 적용 전 로그 검토</text>
  <line x1="40" y1="612" x2="600" y2="612" stroke="#bfc0c0"/>
  <text x="320" y="644" text-anchor="middle" class="detail">Custom Allow로 우회 불가 · WAF exception 사용</text>
</svg>
