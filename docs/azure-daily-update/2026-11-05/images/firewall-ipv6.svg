<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="firewall-ipv6-title firewall-ipv6-desc">
  <title id="firewall-ipv6-title">Azure Firewall IPv6 application rules</title>
  <desc id="firewall-ipv6-desc">IPv6 HTTP and HTTPS outbound traffic is evaluated by network rules first. If there is no network rule match, application rules use HTTP Host or HTTPS SNI to allow or deny the request.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2563eb"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#0284c7"/></marker>
  </defs>
  <rect width="960" height="360" fill="#f8fafc"/>
  <g font-family="'Noto Sans KR', Arial, sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="480" y="40" font-size="24" font-weight="700">IPv6 HTTP / HTTPS outbound policy evaluation</text>
    <path d="M224 184H288" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M608 140H704" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-link)"/>
    <path d="M608 228H648Q656 228 656 236V256Q656 264 664 264H704" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="128" width="200" height="112" rx="8" fill="#fff" stroke="#64748b"/>
    <text x="124" y="164" font-size="20" font-weight="700">IPv6 workload</text>
    <text x="124" y="198" font-size="18">HTTP / HTTPS</text>
    <text x="124" y="224" font-size="17" fill="#334155">Outbound request</text>
    <rect x="288" y="96" width="320" height="176" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="448" y="128" font-size="20" font-weight="700">Azure Firewall Policy</text>
    <text x="448" y="160" font-size="18">1. Network rules</text>
    <text x="448" y="184" font-size="16" fill="#334155">Match: stop / No match: continue</text>
    <text x="448" y="216" font-size="18" font-weight="600">2. Application rules</text>
    <text x="448" y="248" font-size="17" fill="#334155">HTTP Host / HTTPS SNI</text>
    <rect x="704" y="88" width="224" height="80" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="816" y="124" font-size="20" font-weight="700">Allow</text>
    <text x="816" y="152" font-size="17" fill="#334155">Permitted destination</text>
    <rect x="704" y="224" width="224" height="80" rx="8" fill="#fff" stroke="#64748b"/>
    <text x="816" y="260" font-size="20" font-weight="700">Deny</text>
    <text x="816" y="288" font-size="17" fill="#334155">Blocked request</text>
    <path d="M24 324H936" stroke="#cbd5e1"/>
    <text x="480" y="348" font-size="15" fill="#334155">Conceptual outbound flow · IPv6 application rules: Public Preview</text>
  </g>
</svg>
