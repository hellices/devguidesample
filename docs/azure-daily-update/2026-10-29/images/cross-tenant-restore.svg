<svg xmlns="http://www.w3.org/2000/svg" width="960" height="552" viewBox="0 0 960 552" role="img" aria-labelledby="ctr-title ctr-desc">
  <title id="ctr-title">Azure Backup Cross-Tenant Restore</title>
  <desc id="ctr-desc">A source vault maps to a Resource Guard protected target vault in another tenant; existing Microsoft managed vaulted backup data restores a VM in the target tenant, without a second backup copy.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 8 3 0 6Z" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 8 3 0 6Z" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 8 3 0 6Z" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="960" height="552" fill="#f5f5f5"/>
  <g font-family="Arial, sans-serif" fill="#2d3142">
    <text x="24" y="40" font-size="24" font-weight="600">Recover in a different tenant, using the existing backup</text>
    <rect x="24" y="80" width="240" height="368" rx="8" fill="#ececec" stroke="#bfc0c0"/>
    <rect x="288" y="272" width="280" height="176" rx="8" fill="#ececec" stroke="#bfc0c0"/>
    <rect x="592" y="80" width="344" height="368" rx="8" fill="#ececec" stroke="#bfc0c0"/>
    <text x="48" y="108" font-size="18" font-weight="600">Source tenant</text>
    <text x="312" y="300" font-size="18" font-weight="600">Microsoft-managed tenant</text>
    <text x="616" y="108" font-size="18" font-weight="600">Target tenant</text>

    <g fill="none" stroke-width="2">
      <path d="M144 208V320" stroke="#4f5d75" marker-end="url(#arrow)"/>
      <path d="M240 376H312" stroke="#4f5d75" marker-end="url(#arrow)"/>
      <path d="M240 340H264Q272 340 272 332V176Q272 168 280 168H616" stroke="#2e5aa8" stroke-dasharray="6 5" marker-end="url(#arrow-link)"/>
      <path d="M544 360H616" stroke="#eb6c36" marker-end="url(#arrow-accent)"/>
      <path d="M764 224V320" stroke="#4f5d75" marker-end="url(#arrow)"/>
    </g>

    <rect x="320" y="132" width="228" height="28" fill="#f5f5f5"/>
    <text x="434" y="152" font-size="18" text-anchor="middle" fill="#2e5aa8">Vault mapping</text>
    <rect x="156" y="248" width="88" height="28" fill="#ececec"/>
    <text x="164" y="268" font-size="18" fill="#4f5d75">Backup</text>
    <rect x="776" y="248" width="144" height="28" fill="#ececec"/>
    <text x="784" y="268" font-size="18" fill="#4f5d75">Start restore</text>

    <rect x="48" y="128" width="192" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
    <text x="144" y="174" font-size="20" font-weight="600" text-anchor="middle">Source VM</text>
    <rect x="48" y="320" width="192" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
    <text x="144" y="366" font-size="20" font-weight="600" text-anchor="middle">Source vault</text>
    <rect x="312" y="320" width="232" height="80" rx="6" fill="#e4e6ea" stroke="#4f5d75"/>
    <text x="428" y="354" font-size="20" font-weight="600" text-anchor="middle">Vaulted backup data</text>
    <text x="428" y="382" font-size="17" text-anchor="middle" fill="#4f5d75">Existing recovery points</text>
    <rect x="616" y="128" width="296" height="96" rx="6" fill="#fcece5" stroke="#eb6c36" stroke-width="2"/>
    <text x="764" y="160" font-size="20" font-weight="600" text-anchor="middle">Target vault</text>
    <text x="764" y="188" font-size="18" text-anchor="middle">Resource Guard + MUA</text>
    <text x="764" y="212" font-size="16" text-anchor="middle" fill="#4f5d75">Protects mapping operations</text>
    <rect x="616" y="320" width="296" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
    <text x="764" y="354" font-size="20" font-weight="600" text-anchor="middle">Restored VM</text>
    <text x="764" y="382" font-size="17" text-anchor="middle" fill="#4f5d75">Alternate location</text>

    <path d="M24 476H936" stroke="#bfc0c0"/>
    <text x="24" y="504" font-size="18" fill="#4f5d75">Dashed: mapping. Solid: backup data or restore operation.</text>
    <text x="24" y="532" font-size="18" fill="#4f5d75">Source and target vaults: same region. Mapping is not a second backup copy.</text>
  </g>
</svg>
