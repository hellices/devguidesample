<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc">
  <title id="title">AKS on bare metal: Ubuntu</title>
  <desc id="desc">Azure management and Azure Arc connect to an on-premises host. AKS manages the Kubernetes control plane and worker layer directly on Ubuntu without a hypervisor. The customer manages Ubuntu and the hardware.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1100" height="530" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="550" y="42" fill="#0f172a" font-size="25" font-weight="700">AKS on bare metal: Ubuntu</text>
    <rect x="185" y="70" width="730" height="85" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <text x="550" y="106" font-size="20" font-weight="700" fill="#0f172a">Azure management + Azure Arc</text>
    <text x="550" y="134" font-size="16" fill="#334155">Azure CLI · AKS Resource provider · Lifecycle management</text>
    <path d="M550 167V210" fill="none" stroke="#2563eb" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="85" y="225" width="930" height="265" rx="14" fill="#fff" stroke="#94a3b8"/>
    <text x="550" y="255" font-size="18" font-weight="700" fill="#334155">Customer on-premises host</text>
    <rect x="115" y="278" width="870" height="85" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="550" y="310" font-size="20" font-weight="700" fill="#0f172a">Kubernetes layer — managed by AKS</text>
    <text x="550" y="341" font-size="17" fill="#334155">Control plane + Worker components + Workloads · Single-node cluster</text>
    <rect x="115" y="380" width="870" height="85" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="550" y="412" font-size="20" font-weight="700" fill="#0f172a">Ubuntu + Hardware — managed by customer</text>
    <text x="550" y="443" font-size="17" fill="#334155">OS · Kernel · Drivers · CPU / GPU · Storage · Network</text>
    <text x="550" y="514" font-size="16" fill="#334155">Kubernetes runs directly on the host OS — no hypervisor layer</text>
  </g>
</svg>
