<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="pgupgrade-title pgupgrade-desc">
  <title id="pgupgrade-title">PostgreSQL 19 호환성 검사와 in-place upgrade</title>
  <desc id="pgupgrade-desc">East Asia의 적격 flexible server에서 사전 호환성 검사를 거친 뒤 실제 업그레이드는 서비스 중지와 백업, pg_upgrade, 통계 갱신과 워크로드 검증으로 이어진다. 사전 검사 자체는 버전을 변경하거나 중단을 일으키지 않는다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#64748b"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2563eb"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2563eb"/></marker>
    <style>text{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#172554;font-size:20px}.name{font-size:23px;font-weight:600}.note{font-size:18px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="360" fill="#fff"/>
  <text x="40" y="48" class="name">신규 배포뿐 아니라 기존 서버의 PostgreSQL 19 전환도 평가</text>
  <path d="M240 176H280" class="edge"/><path d="M480 176H520" class="edge"/><path d="M720 176H760" class="edge"/>
  <rect x="40" y="104" width="200" height="144" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="140" y="144" text-anchor="middle" class="name">사전 검사</text>
  <text x="140" y="182" text-anchor="middle">확장·구성·호환성</text>
  <text x="140" y="216" text-anchor="middle">문제 해소 후 진행</text>
  <rect x="280" y="104" width="200" height="144" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="380" y="144" text-anchor="middle" class="name">서비스 중지</text>
  <text x="380" y="182" text-anchor="middle">업그레이드 중단 구간</text>
  <text x="380" y="216" text-anchor="middle">직전 백업 생성</text>
  <rect x="520" y="104" width="200" height="144" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="620" y="144" text-anchor="middle" class="name">pg_upgrade</text>
  <text x="620" y="182" text-anchor="middle">같은 서버에서 전환</text>
  <text x="620" y="216" text-anchor="middle">서버 이름 유지</text>
  <rect x="760" y="104" width="160" height="144" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="840" y="144" text-anchor="middle" class="name">전환 후 검증</text>
  <text x="840" y="182" text-anchor="middle">ANALYZE</text>
  <text x="840" y="216" text-anchor="middle">쿼리·앱 확인</text>
  <path d="M40 280H920" stroke="#cbd5e1"/>
  <text x="40" y="312" class="note">Azure Database for PostgreSQL flexible server · PostgreSQL 19 Public Preview · East Asia</text>
  <text x="40" y="342" class="note">사전 검사 자체는 버전 변경·중단 없음 · 실제 major version upgrade는 downtime 발생</text>
</svg>
