<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="dbagent-title dbagent-desc">
  <title id="dbagent-title">PostgreSQL 문제 탐지에서 사람의 수동 대응까지</title>
  <desc id="dbagent-desc">Database Agent는 지원 시나리오를 탐지하고 지표·구성·쿼리 계획·로그를 AI로 조사해 근거와 권고를 제공한다. 운영자는 현재 상태를 검증한 뒤 별도의 승인된 절차로 직접 조치한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#64748b"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2563eb"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2563eb"/></marker>
    <style>text{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#172554;font-size:20px}.name{font-size:23px;font-weight:600}.note{font-size:18px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="360" fill="#fff"/>
  <text x="40" y="48" class="name">AI는 조사·권고, 실제 변경은 운영자가 검증 후 실행</text>
  <path d="M240 176H280" class="edge"/><path d="M480 176H520" class="edge"/><path d="M720 176H760" class="edge"/>
  <rect x="40" y="104" width="200" height="144" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="140" y="144" text-anchor="middle" class="name">문제 탐지</text>
  <text x="140" y="182" text-anchor="middle">CPU·잠금·연결</text>
  <text x="140" y="216" text-anchor="middle">선택한 시나리오</text>
  <rect x="280" y="104" width="200" height="144" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="380" y="144" text-anchor="middle" class="name">AI 조사</text>
  <text x="380" y="182" text-anchor="middle">지표·구성·로그</text>
  <text x="380" y="216" text-anchor="middle">쿼리 계획 분석</text>
  <rect x="520" y="104" width="200" height="144" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="620" y="144" text-anchor="middle" class="name">근거·권고</text>
  <text x="620" y="182" text-anchor="middle">원인 가설·SQL</text>
  <text x="620" y="216" text-anchor="middle">예상 효과·Rollback</text>
  <rect x="760" y="104" width="160" height="144" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="840" y="144" text-anchor="middle" class="name">운영자 대응</text>
  <text x="840" y="182" text-anchor="middle">실시간 상태 검증</text>
  <text x="840" y="216" text-anchor="middle">수동 조치·재확인</text>
  <path d="M40 280H920" stroke="#cbd5e1"/>
  <text x="40" y="312" class="note">Visual Studio Code의 PostgreSQL extension · PostgreSQL 16 이상 · 승인형 접근</text>
  <text x="40" y="342" class="note">서버 리전: South Central US·West US 3·Sweden Central · 자동 수정 기능 아님</text>
</svg>
