<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 704" role="img" aria-labelledby="rate-group-title rate-group-desc">
  <title id="rate-group-title">Front Door WAF의 JA4별 요청 집계</title>
  <desc id="rate-group-desc">서로 다른 IP의 요청도 같은 JA4라면 한 edge 안에서 같은 counter로 집계하며, 임계값 초과 시 설정한 action을 적용한다. 다른 edge의 counter와는 합산하지 않는다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    <style>
      text { font-family: "Noto Sans KR", sans-serif; fill: #2d3142; font-size: 22px; }
      .name { font-weight: 600; }
      .detail { fill: #4f5d75; font-size: 19px; }
    </style>
  </defs>
  <rect width="640" height="704" fill="#f5f5f5"/>
  <text x="320" y="40" text-anchor="middle" class="name">IP가 달라도 같은 JA4라면 함께 집계</text>
  <rect x="56" y="208" width="528" height="376" rx="8" fill="#ececec" stroke="#bfc0c0"/>
  <path d="M320 160 V264" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)"/>
  <path d="M320 328 V368" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M320 448 V488" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <rect x="144" y="72" width="352" height="88" rx="8" fill="#ffffff" stroke="#7a8399"/>
  <text x="320" y="108" text-anchor="middle" class="name">서로 다른 IP의 client</text>
  <text x="320" y="140" text-anchor="middle" class="detail">동일한 TLS 구성 → 같은 JA4</text>
  <text x="80" y="240" class="name">Front Door WAF · Edge A</text>
  <rect x="104" y="264" width="432" height="64" rx="8" fill="#ffffff" stroke="#2d3142"/>
  <text x="320" y="304" text-anchor="middle" class="name">Match condition에 맞는 요청</text>
  <rect x="104" y="368" width="432" height="80" rx="8" fill="#fff1e9" stroke="#eb6c36"/>
  <text x="320" y="400" text-anchor="middle" class="name">JA4별로 공유하는 counter</text>
  <text x="320" y="430" text-anchor="middle" class="detail">이 edge의 고정 window 안에서 집계</text>
  <rect x="104" y="488" width="432" height="64" rx="8" fill="#ffffff" stroke="#2d3142"/>
  <text x="320" y="528" text-anchor="middle" class="name">임계값 초과 → 설정한 action</text>
  <line x1="40" y1="616" x2="600" y2="616" stroke="#bfc0c0"/>
  <text x="320" y="648" text-anchor="middle" class="detail">Edge B 등 다른 edge는 별도 counter 사용</text>
  <text x="320" y="680" text-anchor="middle" class="name">전역 합산 quota가 아님</text>
</svg>
