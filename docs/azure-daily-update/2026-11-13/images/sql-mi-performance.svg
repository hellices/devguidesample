<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="sqlmi-title sqlmi-desc">
  <title id="sqlmi-title">SQL Managed Instance의 관리형 성능 telemetry</title>
  <desc id="sqlmi-desc">SQL Managed Instance의 DMV 성능 데이터를 Microsoft가 수집해 관리형 ADX에 저장하고, 사용자는 RBAC로 보호된 proxy를 통해 KQL로 조회합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="960" height="400" fill="#f5f5f5"/>
  <g font-family="Geist, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" fill="#2d3142">
    <text x="32" y="36" font-size="22" font-weight="600">SQL Managed Instance: 수집·저장 인프라 없이 KQL 분석</text>
    <g fill="none" stroke-width="2">
      <path d="M312 140H440" stroke="#2e5aa8" marker-end="url(#arrow-link)"/>
      <path d="M600 204V240" stroke="#4f5d75" marker-end="url(#arrow)"/>
      <path d="M440 292H312" stroke="#2e5aa8" marker-end="url(#arrow-link)"/>
    </g>
    <rect x="32" y="80" width="280" height="124" rx="6" fill="#fff" stroke="#2d3142"/>
    <text x="172" y="116" text-anchor="middle" font-size="19" font-weight="600">SQL Managed Instance</text>
    <text x="172" y="150" text-anchor="middle" font-size="17">DMV 성능 데이터</text>
    <text x="172" y="180" text-anchor="middle" font-size="16">master에서 instance 단위 활성화</text>
    <rect x="440" y="80" width="320" height="124" rx="6" fill="#fff1e9" stroke="#eb6c36"/>
    <text x="600" y="112" text-anchor="middle" font-size="19" font-weight="600">Microsoft-managed</text>
    <text x="600" y="146" text-anchor="middle" font-size="17">수집 pipeline + ADX 저장소</text>
    <text x="600" y="180" text-anchor="middle" font-size="17">ArcSqlTelemetry</text>
    <rect x="440" y="240" width="320" height="104" rx="6" fill="#fff" stroke="#4f5d75"/>
    <text x="600" y="278" text-anchor="middle" font-size="19" font-weight="600">RBAC-protected proxy</text>
    <text x="600" y="310" text-anchor="middle" font-size="17">접근 가능한 리소스의 row만 반환</text>
    <rect x="32" y="240" width="280" height="104" rx="6" fill="#ececec" stroke="#4f5d75"/>
    <text x="172" y="278" text-anchor="middle" font-size="19" font-weight="600">KQL 분석</text>
    <text x="172" y="310" text-anchor="middle" font-size="17">ADX web UI / REST API</text>
    <text x="32" y="380" font-size="17" fill="#4f5d75">현재 Managed Instance는 KQL 지원 · 내장 Performance 페이지는 미지원</text>
  </g>
</svg>
