<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="mtls-title mtls-desc">
  <title id="mtls-title">Front Door mTLS의 edge 인증서 검증</title>
  <desc id="mtls-desc">Client가 인증서와 intermediate chain을 보내면 Front Door가 Key Vault의 trusted root CA로 검증하고 origin에 client 인증서를 header로 전달합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="960" height="360" fill="#f5f5f5"/>
  <g font-family="Geist, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" fill="#2d3142">
    <text x="32" y="36" font-size="22" font-weight="600">mTLS: client 인증서를 origin 앞에서 검증</text>
    <g fill="none" stroke-width="2">
      <path d="M272 220H360" stroke="#2e5aa8" marker-end="url(#arrow-link)"/>
      <path d="M616 220H704" stroke="#2e5aa8" marker-end="url(#arrow-link)"/>
      <path d="M488 144V172" stroke="#4f5d75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    </g>
    <rect x="360" y="64" width="256" height="80" rx="6" fill="#fff" stroke="#4f5d75"/>
    <text x="488" y="94" text-anchor="middle" font-size="19" font-weight="600">Azure Key Vault</text>
    <text x="488" y="122" text-anchor="middle" font-size="17">Trusted root CA</text>
    <rect x="32" y="172" width="240" height="96" rx="6" fill="#ececec" stroke="#4f5d75"/>
    <text x="152" y="204" text-anchor="middle" font-size="19" font-weight="600">Client</text>
    <text x="152" y="232" text-anchor="middle" font-size="16">인증서 + intermediate chain</text>
    <rect x="360" y="172" width="256" height="96" rx="6" fill="#fff1e9" stroke="#eb6c36"/>
    <text x="488" y="204" text-anchor="middle" font-size="19" font-weight="600">Front Door Premium</text>
    <text x="488" y="232" text-anchor="middle" font-size="17">Chain · 유효성 검증</text>
    <rect x="704" y="172" width="224" height="96" rx="6" fill="#fff" stroke="#2d3142"/>
    <text x="816" y="204" text-anchor="middle" font-size="19" font-weight="600">Origin</text>
    <text x="816" y="232" text-anchor="middle" font-size="17">인증서 header 수신</text>
    <path d="M32 296H928" stroke="#bfc0c0"/>
    <text x="32" y="326" font-size="17" fill="#4f5d75">Edge 검증 모드의 예 · Origin 전달: X-Azure-ClientCertificate</text>
  </g>
</svg>
