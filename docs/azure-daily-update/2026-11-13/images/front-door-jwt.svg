<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="jwt-title jwt-desc">
  <title id="jwt-title">Front Door JWT Auth Policy의 검증 흐름</title>
  <desc id="jwt-desc">Entra ID가 발급한 bearer JWT를 Front Door가 JWKS signing key와 policy로 검증해 origin에 전달하고, Block 모드에서 검증에 실패하면 401로 거부합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="960" height="440" fill="#f5f5f5"/>
  <g font-family="Geist, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" fill="#2d3142">
    <text x="32" y="36" font-size="22" font-weight="600">Auth Policy: Entra ID JWT를 edge에서 검증</text>
    <g fill="none" stroke-width="2">
      <path d="M272 224H360" stroke="#2e5aa8" marker-end="url(#arrow-link)"/>
      <path d="M648 224H736" stroke="#2e5aa8" marker-end="url(#arrow-link)"/>
      <path d="M504 144V172" stroke="#4f5d75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
      <path d="M504 276V304" stroke="#eb6c36" marker-end="url(#arrow-accent)"/>
    </g>
    <rect x="360" y="64" width="288" height="80" rx="6" fill="#fff" stroke="#4f5d75"/>
    <text x="504" y="94" text-anchor="middle" font-size="19" font-weight="600">Microsoft Entra ID</text>
    <text x="504" y="122" text-anchor="middle" font-size="17">JWKS signing key</text>
    <rect x="32" y="172" width="240" height="104" rx="6" fill="#ececec" stroke="#4f5d75"/>
    <text x="152" y="208" text-anchor="middle" font-size="19" font-weight="600">Client</text>
    <text x="152" y="240" text-anchor="middle" font-size="17">Entra ID bearer JWT</text>
    <rect x="360" y="172" width="288" height="104" rx="6" fill="#fff1e9" stroke="#eb6c36"/>
    <text x="504" y="204" text-anchor="middle" font-size="19" font-weight="600">Front Door Premium</text>
    <text x="504" y="234" text-anchor="middle" font-size="17">서명 · 만료 · issuer · audience</text>
    <text x="504" y="260" text-anchor="middle" font-size="16">Auth Policy / Block</text>
    <rect x="736" y="172" width="192" height="104" rx="6" fill="#fff" stroke="#2d3142"/>
    <text x="832" y="208" text-anchor="middle" font-size="19" font-weight="600">Origin</text>
    <text x="832" y="240" text-anchor="middle" font-size="17">성공 요청 처리</text>
    <rect x="360" y="304" width="288" height="64" rx="6" fill="#fff" stroke="#eb6c36"/>
    <text x="504" y="342" text-anchor="middle" font-size="18">검증 실패 → HTTP 401</text>
    <path d="M32 388H928" stroke="#bfc0c0"/>
    <text x="32" y="418" font-size="17" fill="#4f5d75">Log 모드는 실패해도 통과 · 애플리케이션 authorization은 별도</text>
  </g>
</svg>
