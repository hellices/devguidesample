<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 790" role="img" aria-labelledby="title desc">
  <title id="title">MCP authorization obtains token A; Entra OBO obtains a separate token B</title>
  <desc id="desc">An MCP client obtains a token for the MCP API through OAuth discovery and authorization. The MCP API uses that user token as an OBO assertion to obtain another token for the downstream data API. APIM and Toolbox product support must be evaluated separately from this generic flow.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34536f"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;font-size:20px;fill:#162b40}.title{font-size:28px;font-weight:700}.small{font-size:18px}.head{fill:#edf5ff;stroke:#2565a4;stroke-width:2}.life{stroke:#a4b3c2;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#34536f;stroke-width:2.5;marker-end:url(#arrow)}</style>
  <rect width="1180" height="790" fill="white"/>
  <text x="30" y="43" class="title">MCP OAuth and Entra OBO solve different token requirements</text>
  <rect x="30" y="90" width="190" height="65" rx="10" class="head"/><text x="125" y="130" text-anchor="middle">MCP client</text>
  <rect x="315" y="90" width="190" height="65" rx="10" class="head"/><text x="410" y="130" text-anchor="middle">Entra ID</text>
  <rect x="655" y="90" width="210" height="65" rx="10" class="head"/><text x="760" y="130" text-anchor="middle">Protected MCP API</text>
  <rect x="950" y="90" width="200" height="65" rx="10" class="head"/><text x="1050" y="130" text-anchor="middle">Downstream API</text>
  <path d="M125 155V690M410 155V690M760 155V690M1050 155V690" class="life"/>
  <path d="M760 215H125" class="flow"/><text x="150" y="200" class="small">1. Protected-resource metadata with authorization-server URL</text>
  <path d="M125 275H410" class="flow"/><text x="137" y="261" class="small">2. Authorization code + PKCE</text>
  <path d="M410 335H125" class="flow"/><text x="142" y="321" class="small">3. Token A for the MCP API</text>
  <path d="M125 400H760" class="flow"/><text x="150" y="385" class="small">4. MCP request with A; validate audience and delegated permission</text>
  <path d="M760 470H410" class="flow"/><text x="428" y="455" class="small">5. OBO assertion A + API credentials</text>
  <path d="M410 535H760" class="flow"/><text x="428" y="520" class="small">6. Token B for the downstream API</text>
  <path d="M760 600H1050" class="flow"/><text x="779" y="585" class="small">7. Data request with token B</text>
  <path d="M1050 663H760" class="flow"/><text x="790" y="648" class="small">Authorized result</text>
  <text x="30" y="734" class="small">OBO is an Entra user-delegation flow, not a measure of complete MCP protocol support.</text>
  <text x="30" y="763" class="small">A token for another audience, or an app-only token, cannot replace the required user assertion.</text>
</svg>
