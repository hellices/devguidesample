<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 770" role="img" aria-labelledby="title desc">
  <title id="title">Foundry hosted agent consuming governed MCP tools</title>
  <desc id="desc">Users call the hosted agent through Responses or Invocations. Foundry manages the agent runtime and identity. Agent code calls models and MCP tools, with external MCP routed through APIM to separately hosted backend servers.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34536f"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;font-size:20px;fill:#162b40}.title{font-size:28px;font-weight:700}.small{font-size:18px}.box{fill:#edf5ff;stroke:#2565a4;stroke-width:2}.boundary{fill:#f8fafc;stroke:#8397aa;stroke-width:2;stroke-dasharray:8 6}.gateway{fill:#fff7e7;stroke:#9c661c;stroke-width:2}.backend{fill:#eef8f1;stroke:#327449;stroke-width:2}.flow{fill:none;stroke:#34536f;stroke-width:2.5;marker-end:url(#arrow)}</style>
  <rect width="1160" height="770" fill="white"/>
  <text x="30" y="44" class="title">Hosted agent runtime is not MCP backend hosting</text>
  <rect x="350" y="110" width="405" height="490" rx="18" class="boundary"/>
  <text x="375" y="150">Foundry Agent Service</text>
  <rect x="35" y="210" width="235" height="130" rx="12" class="box"/>
  <text x="152" y="255" text-anchor="middle"><tspan x="152">User application</tspan><tspan x="152" dy="34" class="small">Agent request</tspan></text>
  <rect x="385" y="205" width="335" height="115" rx="12" class="box"/>
  <text x="552" y="246" text-anchor="middle"><tspan x="552">Agent endpoint</tspan><tspan x="552" dy="33" class="small">Responses / Invocations</tspan></text>
  <path d="M270 270H385" class="flow"/>
  <rect x="385" y="385" width="335" height="160" rx="12" class="box"/>
  <text x="552" y="427" text-anchor="middle"><tspan x="552">Hosted agent code</tspan><tspan x="552" dy="33" class="small">Reasoning / workflow</tspan><tspan x="552" dy="29" class="small">Session and lifecycle</tspan><tspan x="552" dy="29" class="small">Dedicated agent identity</tspan></text>
  <path d="M552 320V385" class="flow"/>
  <rect x="865" y="190" width="265" height="110" rx="12" class="backend"/>
  <text x="997" y="234" text-anchor="middle"><tspan x="997">Foundry models</tspan><tspan x="997" dy="32" class="small">Inference API</tspan></text>
  <path d="M720 425H797V245H865" class="flow"/>
  <rect x="865" y="395" width="265" height="125" rx="12" class="gateway"/>
  <text x="997" y="438" text-anchor="middle"><tspan x="997">APIM MCP endpoint</tspan><tspan x="997" dy="33" class="small">Approved API policies</tspan></text>
  <path d="M720 470H865" class="flow"/><text x="770" y="458" class="small">MCP</text>
  <rect x="825" y="600" width="305" height="105" rx="12" class="backend"/>
  <text x="977" y="642" text-anchor="middle"><tspan x="977">Separately hosted MCP server</tspan><tspan x="977" dy="32" class="small">Business tools / data access</tspan></text>
  <path d="M997 520V600" class="flow"/>
  <text x="35" y="660" class="small">Toolbox can be added between agent code and APIM.</text>
  <text x="35" y="741" class="small">Agent identity authorizes the agent. User-scoped data access still needs an explicit supported delegation flow.</text>
</svg>
